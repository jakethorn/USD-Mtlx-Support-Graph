- id: aousd-core-spec-1-0
  date: 2025-12-17
  title: Alliance for OpenUSD ratifies the OpenUSD Core Specification 1.0
  tech: [usd]
  kind: spec
  description: >-
    AOUSD publishes Core Specification 1.0, formally specifying OpenUSD's foundational data types, document data model,
    LIVERPS composition algorithm, stage population, value resolution, and USDA/USDC/USDZ file formats.
