      accessed: 2026-11-04

- id: aousd-formed
  date: 2023-08-01
  title: Pixar, Adobe, Apple, Autodesk, and NVIDIA form the Alliance for OpenUSD (AOUSD)
  tech: [usd]
  kind: organization
  description: >-
    Hosted by the Linux Foundation's Joint Development Foundation, the Alliance for OpenUSD (AOUSD) is launched to
    formalize written specifications for OpenUSD and coordinate cross-industry standardization.
  sources:
    - url: https://aousd.org/news/pixar-adobe-apple-autodesk-and-nvidia-form-alliance-for-openusd-to-drive-open-standards-for-3d-content/
      title: Pixar, Adobe, Apple, Autodesk, and NVIDIA Form Alliance for OpenUSD to Drive Open Standards for 3D Content
      kind: news
      accessed: 2026-11-04

- id: openpbr-announced
  date: 2023-08-02
  title: Autodesk and Adobe announce OpenPBR as an ASWF MaterialX subproject
  tech: [materialx]
  kind: spec
  description: >-
    Developed jointly by Autodesk and Adobe and hosted as a subproject of MaterialX under the ASWF, OpenPBR is unveiled
    as an open, artist-friendly surface shading specification to succeed Autodesk Standard Surface and Adobe Standard
    Material.
  sources:
    - url: https://www.aswf.io/blog/academy-software-foundation-announces-openpbr-a-new-subproject-of-materialx/
      title: Academy Software Foundation Announces OpenPBR, a New Subproject of MaterialX
      kind: blog
      accessed: 2026-11-04

- id: openusd-academy-award
  date: 2024-02-21
  title: OpenUSD creators receive an Academy Scientific and Technical Award
  tech: [usd]
  kind: milestone
  description: >-
    The Academy of Motion Picture Arts and Sciences honors Pixar's OpenUSD architecture and engineering team with a
    Scientific and Technical Achievement Award for its impact on motion picture pipelines.
  sources:
    - url: https://aousd.org/blog/openusd-wins-academy-award-for-scientific-and-technical-achievement/
      title: OpenUSD Wins Academy Award for Scientific and Technical Achievement
      kind: blog
      accessed: 2026-11-04

