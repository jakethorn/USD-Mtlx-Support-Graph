name: Cinema 4D
vendor: Maxon
categories: [dcc]
industries: [film-tv, vfx, animation, product-design]
license: commercial
website: https://www.maxon.net/en/cinema-4d
tier: 1
summary: >-
  USD import/export since R23 (USDZ, cameras, lights, instances, skeletal animation, baked material approximations).
  A USD Bridge keeps opened files linked so edits can be written back. No MaterialX support is documented; Redshift's
  OpenPBR material is the default since 2026.2.

