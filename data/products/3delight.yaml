        kind: issue
        accessed: 2026-11-04

  - capability: usd.shade.preview_surface
    level: native
    notes: >
      hdNSI includes native OSL implementations of UsdPreviewSurface (supporting
      metallic and specular workflows, clearcoat, ior, opacity, opacityMode,
      opacityThreshold, normal maps, and connected downstream surface outputs),
      UsdUVTexture (with UDIM and USDZ package path support), UsdTransform2d,
      and UsdPrimvarReader (float, float2, float3, int, normal, point, string,
      vector).
    gaps:
      - "UsdPreviewSurface displacement and occlusion inputs are declared on the OSL shader but not evaluated."
      - "Normal map tangent basis calculation in UsdPreviewSurface.osl assumes the UV attribute is named st."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/osl/UsdPreviewSurface.osl
        title: "3Delight/HydraNSI — hdNSI/osl/UsdPreviewSurface.osl"
        kind: repo
        accessed: 2026-11-04
