name: 3Delight
vendor: Illumination Research
categories: [renderer]
industries: [film-tv, vfx, animation]
license: commercial
website: https://www.3delight.com/
tier: 2
summary: >
  Path-tracing production renderer built on the Nodal Scene Interface (NSI) and
  Open Shading Language (OSL), with the open-source HydraNSI (hdNSI) Hydra
  render delegate for Houdini Solaris, Katana, and usdview, plus native
  UsdPreviewSurface and MaterialX network rendering.

