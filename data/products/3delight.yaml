  - capability: usd.shade.native
    level: native
    notes: >
      3Delight registers all compiled OSL shaders (.oso) with USD's Sdr registry
      via HdNSIDiscoveryPlugin and HdNSIOsoParserPlugin (and Omniverse MDL
      OmniPBR/OmniGlass shaders via HdNSIMdlParserPlugin), and exports surface,
      displacement, volume, and lightFilter UsdShade networks to NSI shader
      nodes.
    confidence: high
    verified: 2026-11-04
