support:
  - capability: usd.hydra.delegate
    level: native
    hosts: [houdini, katana, maya]
    notes: >
      3Delight's open-source HydraNSI (hdNSI) render delegate translates Hydra
      scene primitives into Nodal Scene Interface (NSI) API calls for
      interactive and batch rendering in Houdini Solaris (viewport and husk),
      usdview, Katana (built with FindKatanaUSD.cmake), and Maya via Multiverse
      USD. Supports NSI stream export (nsi:apistream / HDNSI_TRACE), 3Delight
      Display output, and multi-frame 3Delight Cloud sequence contexts. Built
      against USD 19.11 through 26.08+.
    gaps:
      - "Katana Hydra integration is marked experimental in the HydraNSI documentation."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/README.md
        title: "3Delight/HydraNSI — README.md"
        kind: repo
        accessed: 2026-11-04
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/renderDelegate.cpp
        title: "3Delight/HydraNSI — hdNSI/renderDelegate.cpp"
        kind: repo
        accessed: 2026-11-04
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/cmake/modules/FindKatanaUSD.cmake
        title: "3Delight/HydraNSI — cmake/modules/FindKatanaUSD.cmake"
        kind: repo
        accessed: 2026-11-04

  - capability: usd.render_settings
    level: native
    hosts: [houdini, katana]
    notes: >
      hdNSI implements HdRenderSettings Bprims and HdNSIRenderSettingsPlugin
      (registering HdsiRenderSettingsFilteringSceneIndex), plus global NSI
      settings (shading, pixel, volume, and caustic samples; max diffuse,
      reflection, refraction, and hair ray depths; clamping; IPR denoising;
      DoF; sky light) and custom render products (nsi:exr, nsi:deepexr,
      nsi:deepalphaexr, nsi:dwaaexr, nsi:display, nsi:apistream). Supports
      custom AOVs, LPEs, and Cryptomatte ID output (updated in May–June 2026).
    gaps:
      - "Changing sample counts in live render triggers a full re-render from scratch (#22)."
      - "Cryptomatte AOV setup in Solaris requires matching render var data type and layer configuration (#47)."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/renderSettings.cpp
        title: "3Delight/HydraNSI — hdNSI/renderSettings.cpp"
        kind: repo
        accessed: 2026-11-04
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/renderSettingsPlugin.cpp
        title: "3Delight/HydraNSI — hdNSI/renderSettingsPlugin.cpp"
        kind: repo
        accessed: 2026-11-04
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/renderPass.cpp
        title: "3Delight/HydraNSI — hdNSI/renderPass.cpp"
        kind: repo
        accessed: 2026-11-04
      - url: https://gitlab.com/3Delight/HydraNSI/-/work_items/22
        title: "3Delight/HydraNSI Issue #22 — Updating render settings triggers a full re-render"
        kind: issue
        accessed: 2026-11-04

  - capability: usd.geom.meshes
    level: native
    notes: >
      HdNSIMesh supports polygon meshes, Catmull-Clark subdivision surfaces with
      corner and crease sharpness tags, GeomSubsets face-set material
      assignments, smooth normal generation, left/right-handed winding order,
      face culling (added Oct 2026), arbitrary primvars, and nsi:object:*
      visibility, caustics, matte, and prelit object attributes.
    gaps:
      - "Only the catmull-clark subdivision scheme is enabled on NSI meshes; bilinear and loop schemes are treated as unsubdivided polygon meshes."
      - "Subdivision holeIndices are not exported in HdNSIMesh."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/mesh.cpp
        title: "3Delight/HydraNSI — hdNSI/mesh.cpp"
        kind: repo
        accessed: 2026-11-04
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/rprimBase.cpp
        title: "3Delight/HydraNSI — hdNSI/rprimBase.cpp"
        kind: repo
        accessed: 2026-11-04
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/primvars.cpp
        title: "3Delight/HydraNSI — hdNSI/primvars.cpp"
        kind: repo
        accessed: 2026-11-04

  - capability: usd.geom.curves
    level: native
    notes: >
      HdNSICurves translates UsdGeomBasisCurves into NSI curves primitives with
      linear, catmull-rom, and b-spline bases, per-point widths, normals,
      displayColor, and arbitrary primvars.
    gaps:
      - "Bezier basis curves are not directly supported in HdNSICurves and fall back to the catmull-rom basis."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/curves.cpp
        title: "3Delight/HydraNSI — hdNSI/curves.cpp"
        kind: repo
        accessed: 2026-11-04

  - capability: usd.geom.points
    level: native
    notes: >
      HdNSIPointCloud translates UsdGeomPoints into NSI particles primitives
      with per-point widths, normals, displayColor, time-sampled motion blur,
      and arbitrary primvars. OpenVDB points grids are also supported via
      vdbparticles nodes since 2.9.192.
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/pointcloud.cpp
        title: "3Delight/HydraNSI — hdNSI/pointcloud.cpp"
        kind: repo
        accessed: 2026-11-04
      - url: https://documentation.3delightcloud.com/display/3DfH/Changelog
        title: "3Delight for Houdini — Changelog (2.9.192 OpenVDB points)"
        kind: release-notes
        accessed: 2026-11-04

  - capability: usd.volumes
    level: native
    notes: >
      HdNSIVolume translates Hydra volume Rprims and openvdbAsset fields into
      NSI volume nodes (binding density, color, temperature, emission,
      emissionintensity, and velocity grids plus velocityscale) and
      automatically separates OpenVDB points grids into NSI vdbparticles
      primitives (since 2.9.192). Primvar export on volume objects was added in
      September 2026.
    gaps:
      - "HdNSIVolume only supports a single OpenVDB file path per volume primitive; fields referencing a second file path on the same prim are skipped."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/volume.cpp
        title: "3Delight/HydraNSI — hdNSI/volume.cpp"
        kind: repo
        accessed: 2026-11-04
      - url: https://documentation.3delightcloud.com/display/3DfH/Changelog
        title: "3Delight for Houdini — Changelog (2.9.192)"
        kind: release-notes
        accessed: 2026-11-04

  - capability: usd.instancing
    level: native
    notes: >
      HdNSIPointInstancer and HdNSIRprimBase support both USD native scenegraph
      instancing and UsdGeomPointInstancer, including nested instancers,
      multiple prototypes, time-sampled instance transforms, instanceId AOV
      attributes, and per-instance primvars.
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/pointInstancer.cpp
        title: "3Delight/HydraNSI — hdNSI/pointInstancer.cpp"
        kind: repo
        accessed: 2026-11-04
      - url: https://documentation.3delightcloud.com/display/3DfH/Changelog
        title: "3Delight for Houdini — Changelog (2.9.208 instancing fixes)"
        kind: release-notes
        accessed: 2026-11-04

  - capability: usd.animation
    level: native
    notes: >
      hdNSI exports time-sampled transform matrices, deforming vertex/primvar
      samples (via SamplePrimvar across camera shutter intervals), and
      time-sampled PointInstancer transforms into NSI SetAttributeAtTime calls,
      plus optional quadratic acceleration blur via HdNSIAccelerationBlurPlugin.
      (Note: the top-level README.md still lists Motion Blur under Missing
      Features from 2020, but full time-sampled transform, primvar, instancer,
      and volume velocity blur are implemented in rprimBase.cpp, primvars.cpp,
      and pointInstancer.cpp.)
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/rprimBase.cpp
        title: "3Delight/HydraNSI — hdNSI/rprimBase.cpp (ExportTransform time sampling)"
        kind: repo
        accessed: 2026-11-04
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/primvars.cpp
        title: "3Delight/HydraNSI — hdNSI/primvars.cpp (SamplePrimvar motion blur)"
        kind: repo
        accessed: 2026-11-04
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/accelerationBlurPlugin.cpp
        title: "3Delight/HydraNSI — hdNSI/accelerationBlurPlugin.cpp"
        kind: repo
        accessed: 2026-11-04
      - url: https://documentation.3delightcloud.com/display/3DfH/Changelog
        title: "3Delight for Houdini — Changelog (2.9.200 Solaris motion blur fix)"
        kind: release-notes
        accessed: 2026-11-04

  - capability: usd.skel
    level: partial
    notes: >
      hdNSI registers extComputation Sprims in HdNSIRenderDelegate and evaluates
      HdExtComputationUtils::GetComputedPrimvarValues in HdNSIPrimvars::Sync,
      allowing Hydra's usdSkelImaging skinning computations to deform meshes in
      Solaris and usdview.
    gaps:
      - "The HydraNSI README lists native UsdSkel handling as a missing feature; skinning relies on Hydra's CPU extComputation primvar evaluation rather than native NSI skeletal deformation."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/renderDelegate.cpp
        title: "3Delight/HydraNSI — hdNSI/renderDelegate.cpp (extComputation Sprim)"
        kind: repo
        accessed: 2026-11-04
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/primvars.cpp
        title: "3Delight/HydraNSI — hdNSI/primvars.cpp (GetComputedPrimvarValues)"
        kind: repo
        accessed: 2026-11-04
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/README.md
        title: "3Delight/HydraNSI — README.md"
        kind: repo
        accessed: 2026-11-04

  - capability: usd.lights
    level: native
    notes: >
      HdNSILight supports CylinderLight, DiskLight, DistantLight, DomeLight
      (including domeOffset, custom dome shaders, and USDZ textures),
      RectLight, SphereLight, SpotLights (via shapingConeAngle), and
      LightFilters (HdNSILightFilter), along with UsdLux color temperature,
      shaping focus, IES profiles (shaping:ies:file, angleScale, normalize),
      Houdini barndoors, light linking categories, LPE tags, and nsi:light:*
      ray contribution and caustics attributes.
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/light.cpp
        title: "3Delight/HydraNSI — hdNSI/light.cpp"
        kind: repo
        accessed: 2026-11-04
