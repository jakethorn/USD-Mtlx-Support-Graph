        title: "3Delight/HydraNSI — hdNSI/osl/UsdLuxLight.osl"
        kind: repo
        accessed: 2026-11-04

  - capability: usd.cameras
    level: native
    notes: >
      HdNSICamera and HdNSICameraData translate perspective and orthographic
      USD cameras with depth of field (focalLength, fStop, focusDistance),
      clipping range, shutter intervals, time-sampled camera motion blur, and
      custom 3Delight camera extensions (shutter efficiency, lens squeeze,
      aperture blades/rotation, and dlLensDistortion shader).
    gaps:
      - "Stage metersPerUnit does not scale camera focalLength, horizontalAperture, or verticalAperture in hdNSI (#34)."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://gitlab.com/3Delight/HydraNSI/-/blob/master/hdNSI/camera.cpp
        title: "3Delight/HydraNSI — hdNSI/camera.cpp"
        kind: repo
        accessed: 2026-11-04
