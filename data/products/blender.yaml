        title: Blender 5.0 release notes — Pipeline & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
      - url: https://projects.blender.org/blender/blender/issues/162342
        title: Materials bound to USD Curves get disconnected from geometry on import (#162342)
        kind: issue
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04
    review: >-
      Sources conflict: the 5.2 manual says UsdGeomNurbsCurves import as meshes, while the 5.0 release notes say they
      are now kept as Curves.

  - capability: usd.geom.points
    level: native
    since: "4.2"
    notes: Point cloud import arrived in 4.2 and point cloud export in 4.3.
    gaps:
      - On export, particles are written only while alive and are always visible.
      - Point lifetimes in imported USD point clouds are ignored (tracked as a known issue).
    sources:
      - url: https://developer.blender.org/docs/release_notes/4.2/pipeline_assets_io/
        title: Blender 4.2 LTS release notes — Pipeline, Assets & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.3/pipeline_assets_io/
        title: Blender 4.3 release notes — Pipeline, Assets & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
      - url: https://projects.blender.org/blender/blender/issues/141621
        title: Point cloud particles ignore lifetime range from USD file (#141621)
        kind: issue
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.animation
    level: native
    notes: >-
      On import, animated transforms get a Transform Cache constraint and animated mesh, curve and point geometry a
      Mesh Sequence Cache modifier; primvar animation (colours, UVs, velocities, generic attributes) is read. On export,
      the evaluated scene is written per frame, including deforming and topology-changing meshes.
    gaps:
      - USD file sequences (one file per frame) are not supported on import.
      - Geometry subsets are not time-sampled, which can break topology-changing meshes with several materials.
    sources:
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.skel
    level: native
    since: "4.0"
    notes: >-
      UsdSkel skeleton and blend-shape animation import arrived in 4.0 (as armatures and shape keys); export of
      armatures and shape keys followed in 4.1, and skeleton rest-pose import in 4.5.
    gaps:
      - Bendy bones are not supported on export.
      - Modifiers other than Armature are not applied when exporting skinned meshes.
      - Absolute shape keys are not supported.
      - Blender 5.2 changed where skinned meshes land in the imported hierarchy when Merge parent Xform is on (open bug).
    sources:
      - url: https://developer.blender.org/docs/release_notes/4.0/import_export/
        title: Blender 4.0 release notes — Import & Export
        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.1/pipeline_assets_io/
        title: Blender 4.1 release notes — Pipeline, Assets & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.5/pipeline_assets_io/
        title: Blender 4.5 LTS release notes — Pipeline & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
      - url: https://projects.blender.org/blender/blender/issues/161702
        title: "Behavior change: blender 5.2 imports skinned USD meshes under the Armature (#161702)"
        kind: issue
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.cameras
    level: native
    notes: >-
      Import reads projection (perspective and orthographic), focal length, focus distance, f-stop, clipping, sensor
      shift and aperture size; animated camera properties import since 4.5.
    gaps:
      - Only perspective cameras are exported.
      - Aperture-size import is limited by differences in how USD and Blender interpret sensor dimensions.
    sources:
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.5/pipeline_assets_io/
        title: Blender 4.5 LTS release notes — Pipeline & I/O
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.lights
    level: native
    notes: >-
      Lights import and export, with spot lights written through UsdLuxShapingAPI. Since 4.2 a dome light can become the
      world shader on import and a simple world can be written as a dome light; DomeLight_1 import arrived in 4.5, when
      light exposure, temperature and normalize settings also started to round-trip.
    gaps:
      - Cylinder and geometry lights are not imported.
      - Only the first dome light found is converted to the world.
      - World-to-dome-light export only works for an environment texture feeding a background shader.
    sources:
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.2/pipeline_assets_io/
        title: Blender 4.2 LTS release notes — Pipeline, Assets & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.5/pipeline_assets_io/
