        title: USD MaterialX import (#138106)
        kind: issue
        accessed: 2026-11-04
      - url: https://projects.blender.org/blender/blender/issues/158138
        title: MaterialX Integration Overview (#158138)
        kind: issue
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── MaterialX ────────────────────────────────────────────────────────────
  - capability: mtlx.import
    level: plugin
    via: io-blender-mtlx
    notes: >-
      Activision's add-on loads .mtlx documents and generates native Blender materials whose top-level inputs can be
      edited per material. Blender's own MaterialX-to-shader-node import is marked missing in the MaterialX integration
      design task, which points to such add-ons.
    gaps:
      - Requires Blender 5.0 or later.
      - Only a limited set of MaterialX node definitions is supported.
      - MaterialX graphs cannot be edited inside Blender, and material parameters cannot be animated.
    sources:
      - url: https://github.com/Activision/io_blender_mtlx
        title: Activision/io_blender_mtlx README
        kind: repo
        accessed: 2026-11-04
      - url: https://projects.blender.org/blender/blender/issues/158138
        title: MaterialX Integration Overview (#158138)
        kind: issue
        accessed: 2026-11-04
    confidence: medium
    verified: 2026-11-04

  - capability: mtlx.render
    level: partial
    notes: >-
      Blender converts its shader nodes to MaterialX for Hydra render engines that request it; the bundled Hydra Storm
      engine does so (bl_use_materialx). Cycles and EEVEE do not render MaterialX graphs, which the integration design
      task marks as missing with no approved design.
    gaps:
      - MaterialX is only used as a translation of Blender's own node trees; MaterialX content cannot be loaded natively.
    sources:
      - url: https://projects.blender.org/blender/blender/src/branch/blender-v5.2-release/scripts/addons_core/hydra_storm/engine.py
        title: Hydra Storm add-on engine.py (blender-v5.2-release)
        kind: repo
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.0/python_api/
        title: Blender 4.0 release notes — Python API (Hydra render delegates)
        kind: release-notes
        accessed: 2026-11-04
      - url: https://projects.blender.org/blender/blender/issues/158138
        title: MaterialX Integration Overview (#158138)
        kind: issue
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04
    review: >-
      Interpretation: MaterialX here is an intermediate format for Hydra delegates, not general MaterialX rendering;
      check whether "partial" is the right level.

  - capability: mtlx.openpbr
    level: partial
    since: "4.5"
    notes: >-
      MaterialX export writes Principled BSDF as OpenPBR Surface since 4.5. A native OpenPBR shader node and OpenPBR
      import from USD are tracked as planned work.
    gaps:
      - Export only; there is no OpenPBR shader node in the shipping release.
    sources:
      - url: https://developer.blender.org/docs/release_notes/4.5/pipeline_assets_io/
        title: Blender 4.5 LTS release notes — Pipeline & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://projects.blender.org/blender/blender/issues/156437
        title: OpenPBR Support (#156437)
        kind: issue
        accessed: 2026-11-04
      - url: https://projects.blender.org/blender/blender/issues/156391
        title: "OpenPBR: USD support (export/import/hdCycles) (#156391)"
        kind: issue
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: mtlx.standard_surface
    level: deprecated
    until: "4.5"
    notes: >-
      MaterialX export wrote Principled BSDF as Standard Surface until 4.5, when it switched to OpenPBR Surface as the
      closer match.
    sources:
      - url: https://developer.blender.org/docs/release_notes/4.5/pipeline_assets_io/
        title: Blender 4.5 LTS release notes — Pipeline & I/O
        kind: release-notes
        accessed: 2026-11-04
    confidence: medium
    verified: 2026-11-04
    review: >-
      Inferred from 4.5 release-note wording ("than the previous Standard Surface"); unclear whether Standard Surface is
      still written in any case.

  # ── Rendering ────────────────────────────────────────────────────────────
  - capability: usd.hydra.host
    level: native
    since: "4.0"
    notes: >-
      Since 4.0 render add-ons can be implemented as Hydra render delegates through the HydraRenderEngine Python API, with
      Blender shader nodes optionally converted to MaterialX for them. The Hydra Storm render engine ships as a core
      add-on (still present in the 5.2 release branch), intended mainly to preview how a scene will look in other USD
      applications.
    gaps:
      - The 4.0 notes say Hydra output does not yet match USD export exactly; a developer option renders via USD export instead.
      - Storm's capabilities are limited compared to EEVEE because it was designed mostly for previews.
      - Blender's Hydra viewport does not present Vulkan-backed Hgi textures from third-party delegates (known issue).
    sources:
      - url: https://developer.blender.org/docs/release_notes/4.0/python_api/
