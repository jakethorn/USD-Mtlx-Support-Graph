        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.5/rendering/
        title: Blender 4.5 LTS release notes — Rendering
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.volumes
    level: native
    notes: >-
      UsdVol OpenVDB assets import as Volume objects and Volume objects export; since 4.4, animated volumes generated
      procedurally in Geometry Nodes or by volume modifiers also export.
    sources:
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
