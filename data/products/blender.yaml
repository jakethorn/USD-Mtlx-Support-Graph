tier: 1
summary: >-
  Built-in USD import and export (including USDZ, UsdSkel, UsdPreviewSurface and MaterialX export) that converts to and
  from Blender data rather than editing a live stage. A Hydra render-engine API and the bundled Hydra Storm add-on make
  Blender a Hydra host.

