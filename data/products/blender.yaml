support:
  # ── Interchange ──────────────────────────────────────────────────────────
  - capability: usd.export
    level: native
    since: "2.82"
    notes: >-
      Shipped in 2.82 as an initial implementation and expanded in later releases. Exports visible meshes, cameras,
      curves, text (as meshes), lights, hair, point clouds, metaballs, volumes and armatures, writing the evaluated mesh
      per frame. Export can be extended with Python hooks (4.0), attached to collections as Collection Exporters (4.2),
      and since 5.2 tags prims and textures with their colour space and can save incrementally to cut peak memory.
    gaps:
      - The manual says invisible objects, USD layers and variants are not exported.
      - Geometry subsets are not time-sampled, so animated meshes that change topology can break material assignment.
      - Double-sidedness is taken from the first material and applied to the whole mesh.
      - Geometry Nodes output must contain only the component type matching the object type to export correctly.
    sources:
      - url: https://developer.blender.org/docs/release_notes/2.82/import_&_export/
        title: Blender 2.82 release notes — Import & Export
        kind: release-notes
        accessed: 2026-11-04
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.0/import_export/
        title: Blender 4.0 release notes — Import & Export
        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.2/pipeline_assets_io/
        title: Blender 4.2 LTS release notes — Pipeline, Assets & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/5.2/pipeline_io/
        title: Blender 5.2 LTS release notes — Pipeline & I/O
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.import
    level: native
    since: "3.0"
    notes: >-
      Converts USD prims into a hierarchy of Blender objects (Xforms and Scopes become empties) and rotates Y-up stages
      to Z-up. Options cover path masks, purposes, custom attributes and unit scaling. Import can be extended with Python
      hooks since 4.1, and since 5.2 colours are converted to the blend file's working colour space.
    gaps:
      - The manual says the importer does not yet handle composition concepts such as layers and references.
      - USD file sequences (one file per frame) are not supported.
    sources:
      - url: https://developer.blender.org/docs/release_notes/3.0/pipeline_assets_io/
        title: Blender 3.0 release notes — Pipeline, Assets & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.1/pipeline_assets_io/
        title: Blender 4.1 release notes — Pipeline, Assets & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/5.2/pipeline_io/
        title: Blender 5.2 LTS release notes — Pipeline & I/O
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.usdz
    level: native
    since: "3.5"
    notes: >-
      USDZ import and export were added in 3.5. Exporting to a .usdz file name packs the USD and its textures into the
      archive, with optional texture downsampling (4.2). On import, textures can be skipped, packed into the
      blend file or copied to a folder.
    gaps:
      - UDIM textures cannot be included in USDZ archives; the manual attributes this to a USD library limitation.
    sources:
      - url: https://developer.blender.org/docs/release_notes/3.5/pipeline_assets_io/
        title: Blender 3.5 release notes — Pipeline, Assets & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.2/pipeline_assets_io/
        title: Blender 4.2 LTS release notes — Pipeline, Assets & I/O
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Workflow & composition ───────────────────────────────────────────────
  - capability: usd.layer_editing
    level: none
    notes: >-
      The manual states that the exporter does not support writing USD layers and that the importer does not handle
      layers; USD data is converted to and from Blender objects.
    sources:
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.composition.references
    level: partial
    notes: >-
      With the experimental Instancing export option, collection and object instances are written as references to
      the original prim (meshes, curves and point clouds).
    gaps:
      - The manual says the importer does not yet handle references as a composition concept.
      - Reference authoring on export depends on an experimental option.
    sources:
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04
    review: >-
      Import-side wording ("does not yet handle ... references") is ambiguous; the level reflects export behaviour and
      the manual's statement only.

  - capability: usd.composition.variants
    level: none
    notes: The manual states that Blender does not (yet) export variants.
    sources:
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04
    review: The source only covers export; no documentation of variant selection on import was found.

  - capability: usd.instancing
    level: native
    since: "4.1"
    notes: >-
      Import: scene-graph instances become collection instances (4.1) and point instancers become point clouds driven by
      a Geometry Nodes Instance on Points setup (4.1), including animated instancer attributes since 4.4. Export: the
      experimental Instancing option writes instanced objects as references and, since 4.5, Geometry Nodes point
      instances as UsdGeomPointInstancer.
    gaps:
      - Instancing on export is behind an option the manual labels experimental.
      - Complex point-instancing setups (nested or excluded collections, other scenes) can export incorrectly.
      - Re-exporting imported point instancers does not always round-trip, and animated instancers can miss the first frame.
    sources:
      - url: https://developer.blender.org/docs/release_notes/4.1/pipeline_assets_io/
        title: Blender 4.1 release notes — Pipeline, Assets & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.4/pipeline_assets_io/
        title: Blender 4.4 release notes — Pipeline & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.5/pipeline_assets_io/
        title: Blender 4.5 LTS release notes — Pipeline & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
      - url: https://projects.blender.org/blender/blender/issues/139758
        title: Need to be able to export a USD Point Instancer (#139758)
        kind: issue
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Scene description ────────────────────────────────────────────────────
  - capability: usd.geom.meshes
    level: native
    notes: >-
      Meshes import with UVs, displayColor as colour attributes, primvars as attributes and Subdivision Surface
      modifiers from the subdivision scheme. Export writes UVs (renamed to st by default since 4.2), normals including
      custom normals, an optional subdivision schema (4.1) and indexed UVs that preserve island connectivity (5.1).
      Since 4.4 crease values follow the range OpenSubdiv expects. USD primitive shapes import as meshes.
    gaps:
      - Primvars of type int64, uint, double or half are not supported, and float4 has no Blender equivalent.
    sources:
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.1/pipeline_assets_io/
        title: Blender 4.1 release notes — Pipeline, Assets & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.4/pipeline_assets_io/
        title: Blender 4.4 release notes — Pipeline & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/5.1/pipeline_io/
        title: Blender 5.1 release notes — Pipeline & I/O
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.geom.curves
    level: native
    notes: >-
      Curves and hair export was added in 3.6, and the hair curves object type imports and exports since 4.2.
      BasisCurves import as Curves objects. In 5.0 NURBS curve import and export were reworked so NURBS curves stay
      Curves objects on import and weights are written on export.
    gaps:
      - Legacy particle hair exports parent strands only, with a constant colour and no UVs or normals.
      - Materials bound to imported BasisCurves and NurbsCurves are lost on import in 5.2 (open bug).
    sources:
      - url: https://developer.blender.org/docs/release_notes/3.6/pipeline_assets_io/
        title: Blender 3.6 LTS release notes — Pipeline, Assets & I/O
        kind: release-notes
        accessed: 2026-11-04
