        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Shading ──────────────────────────────────────────────────────────────
  - capability: usd.shade.preview_surface
    level: native
    notes: >-
      Export approximates Principled BSDF node trees as UsdPreviewSurface. On import, viewport colour, metallic and
      roughness come from UsdPreviewSurface, and an option converts it to Principled BSDF networks. Later releases added
      opacityThreshold and emissiveColor (3.6), displacement (4.4), UsdPrimvarReader nodes (4.5) and
      transparency/translucency (5.1).
    gaps:
      - Export only handles simple trees of Diffuse BSDF, Principled BSDF, Image Texture, UV Map and Separate RGB nodes.
      - Conversion to Principled BSDF on import is lossy.
      - An open bug reports that export writes a float specular input instead of the specularColor input the spec defines.
    sources:
      - url: https://docs.blender.org/manual/en/latest/files/import_export/usd.html
        title: Blender 5.2 LTS Manual — Universal Scene Description
        kind: docs
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/3.6/pipeline_assets_io/
        title: Blender 3.6 LTS release notes — Pipeline, Assets & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.4/pipeline_assets_io/
        title: Blender 4.4 release notes — Pipeline & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/4.5/pipeline_assets_io/
        title: Blender 4.5 LTS release notes — Pipeline & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://developer.blender.org/docs/release_notes/5.1/pipeline_io/
        title: Blender 5.1 release notes — Pipeline & I/O
        kind: release-notes
        accessed: 2026-11-04
      - url: https://projects.blender.org/blender/blender/issues/105937
        title: "USD Export: 'specular' input does not conform to UsdPreviewSurface specification (#105937)"
        kind: issue
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.shade.materialx
    level: partial
    since: "4.2"
    notes: >-
      A MaterialX Network export option (4.2) generates MaterialX graphs in UsdShade from Blender shader nodes. Since
      4.5 Principled BSDF is written as OpenPBR Surface.
    gaps:
      - Export only; MaterialX import from USD exists only as a design task.
      - Only a subset of shader nodes converts, and the conversion is tracked as incomplete.
      - Displacement is not supported for MaterialX export.
      - Graphs generated from BSDFs other than Principled BSDF can be hard for other applications to interpret.
    sources:
      - url: https://developer.blender.org/docs/release_notes/4.2/pipeline_assets_io/
        title: Blender 4.2 LTS release notes — Pipeline, Assets & I/O
        kind: release-notes
