name: Gaffer
vendor: Image Engine / Cinesite
categories: [dcc, lookdev]
industries: [film-tv, vfx, animation]
license: open-source
website: https://www.gafferhq.org/
repo: GafferHQ/gaffer
tier: 2
summary: >-
  Open-source, node-based VFX lookdev, lighting, and automation application developed at Image Engine. Reads and writes
  OpenUSD scenes via Cortex's IECoreUSD library, authors sparse USD override layers with USDLayerWriter, and renders
  across Arnold, RenderMan, Cycles, and 3Delight.

