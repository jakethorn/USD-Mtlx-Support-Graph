  - capability: usd.shade.preview_surface
    level: native
    notes: >
      Octane imports UsdPreviewSurface materials from USD files when Load USD
      Materials is enabled in USD Import Preferences; as of Octane 2026.3,
      both the USD and MaterialX importers translate UsdPreviewSurface into
      Octane's Standard Surface material.
    confidence: high
    verified: 2026-11-04
