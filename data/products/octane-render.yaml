  - capability: usd.volumes
    level: native
    notes: >
      Octane supports OpenVDB volumes in Houdini Solaris and in Standalone
      (via Volume and Volume SDF nodes and Standard Volume Medium), with
      absorption, scattering, emission, and velocity motion blur grids.
    confidence: high
