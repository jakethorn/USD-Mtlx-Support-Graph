        accessed: 2026-11-04

  - capability: usd.geom.points
    level: partial
    notes: >
      Octane Standalone imports USD point primitives as sphere particles (with
      configurable default sphere radius and fixes for USD archive point loading
      in 2026.3).
    gaps:
      - "In Houdini Solaris, particles are exported as instanced sphere meshes rather than native Octane sphere particles, and Render Geometry Settings particle size overrides are reported as non-functional (#85427, #85770)."
      - "Time-varying point counts in USD files failed to load in Octane Standalone 2026.4 (fixed for a subsequent release)."
    confidence: high
