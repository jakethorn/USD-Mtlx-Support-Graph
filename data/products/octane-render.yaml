        accessed: 2026-11-04

  - capability: usd.lights
    level: partial
    notes: >
      In Houdini Solaris, Octane supports native UsdLux Area (Rect/Disk),
      Distant, Dome, Sphere/Point, and Spot lights with Octane light extension
      attributes. In Standalone USD import, Octane 2026.6 added support for
      DistantLight, DomeLight_1, textured RectLights, and Blackbody emission
      parity.
    gaps:
      - "The native Solaris Light Linker LOP (UsdLux light linking collections) is ignored by the Octane Solaris render delegate (#85665)."
      - "For a Solaris Dome Light to illuminate the scene, Dome Light must also be explicitly selected as the Environment type in the Octane tab of the Render Settings node."
    confidence: high
    verified: 2026-11-04
    sources:
