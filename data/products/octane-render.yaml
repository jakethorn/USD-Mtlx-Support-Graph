  - capability: usd.animation
    level: native
    notes: >
      Octane's USD Scene node imports rigid-body transform animations, vertex
      deformations, animated camera paths, and curve/instancer motion blur
      (with timeline playback in Standalone), and the Solaris delegate supports
      transformation, deformation, and velocity motion blur (fixed in
      2026.5.0.0).
    confidence: high
    verified: 2026-11-04
    sources:
