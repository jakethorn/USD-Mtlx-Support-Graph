  - capability: usd.instancing
    level: native
    notes: >
      Octane supports USD PointInstancers and scenegraph instances in Houdini
      Solaris and Standalone USD import, including overriding point instances
      with external geometry (added in 2026.3) and time-varying instance counts
      (fixed in 2026.5).
    gaps:
      - "Reading per-instance primvars:displayColor on a USD PointInstancer in Solaris requires manually wiring an Instance Color texture node named displayColor inside the Octane material (#85770)."
