        kind: docs
        accessed: 2026-11-04
      - url: https://docs.otoy.com/SolarisH/Solaris/OctaneAOVs.htm
        title: "OctaneRender for SideFX Solaris Manual — Octane AOVs"
        kind: docs
        accessed: 2026-11-04

  - capability: usd.import
    level: native
    notes: >
      Octane Standalone imports USD files via the Scene geometry node with
      configurable USD Import Preferences (length unit, vertex normals, default
      hair thickness and particle sphere radius, OpenSubdiv scheme and boundary
      interpolation, Load USD Materials, object layers, rest attributes, and
      render/proxy/guide display purpose filtering). USD scenes and referenced
      assets can also be packaged into .orbx archives.
    gaps:
      - "Octane 2026's adaptive meshlets system is only available on single OBJ Mesh nodes and is not yet supported on USD, Alembic, or FBX Scene node graphs."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://docs.otoy.com/standaloneSE/USDImportPreferences.html
        title: "Octane Standalone Documentation — USD Import Preferences"
        kind: docs
        accessed: 2026-11-04
      - url: https://docs.otoy.com/standaloneSE/ImportingandExporting.html
        title: "Octane Standalone Documentation — Importing and Exporting"
        kind: docs
        accessed: 2026-11-04
      - url: https://docs.otoy.com/standaloneSE/Scene.html
        title: "Octane Standalone Documentation — Scene Node"
        kind: docs
        accessed: 2026-11-04
      - url: https://render.otoy.com/forum/viewtopic.php?t=85315
        title: "OctaneRender 2026.1 Release Notes (meshlets limitation on USD scenes)"
        kind: release-notes
        accessed: 2026-11-04

  - capability: usd.export
    level: experimental
    notes: >
      Octane 2027.1 Beta 1 added USD export support to the Geometry Exporter
      node in Octane Standalone; in Octane 2026.x Stable, the Geometry Exporter
      node only exports FBX and Alembic (.abc), while full scene export uses
      OTOY's .orbx/.ocs container format.
    gaps:
      - "USD export via the Geometry Exporter node is only available in 2027.1 development builds; 2026.x Stable only exports FBX and Alembic."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://docs.otoy.com/standaloneSE/GeometryExporter.html
        title: "Octane Standalone Documentation — Geometry Exporter"
        kind: docs
        accessed: 2026-11-04
      - url: https://render.otoy.com/forum/viewtopic.php?t=85910
        title: "OctaneRender 2027.1 Beta 1 Release Notes (Geometry Exporter USD export)"
        kind: release-notes
        accessed: 2026-11-04

  - capability: usd.geom.meshes
    level: native
    notes: >
      Octane's USD Scene importer and Solaris Hydra delegate support polygon
      meshes, OpenSubdiv subdivision surfaces (Catmull-Clark, Catmull-Clark
      smooth variant, Loop, and Bilinear schemes with vertex/face-varying
      boundary interpolation and crease sharpness), vertex normals, rest
      attributes, and up to 10 float and 10 color/vector vertex attributes (as
      of 2026.1).
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://docs.otoy.com/standaloneSE/USDImportPreferences.html
        title: "Octane Standalone Documentation — USD Import Preferences"
        kind: docs
        accessed: 2026-11-04
      - url: https://render.otoy.com/forum/viewtopic.php?t=85315
        title: "OctaneRender 2026.1 Release Notes (10 float and 10 color vertex attributes)"
        kind: release-notes
        accessed: 2026-11-04

  - capability: usd.geom.curves
    level: partial
    notes: >
      Octane Standalone imports hair/curve primitives from USD files with
      configurable default thickness, gradient interpolation, motion blur
      (fixed in 2026.3), and float and color primvars (added in 2026.3).
    gaps:
      - "In Houdini Solaris, users report that hair width and curve type options on USD curves do not always take effect (#85770)."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://docs.otoy.com/standaloneSE/USDImportPreferences.html
        title: "Octane Standalone Documentation — USD Import Preferences (Hair)"
