        title: "OctaneRender for HoudiniSolaris 2026.3.0.0 R1 Thread (Solaris Light Linker report)"
        kind: forum
        accessed: 2026-11-04

  - capability: usd.cameras
    level: native
    notes: >
      Octane imports animated camera paths from USD files in Standalone and
      supports USD cameras in Houdini Solaris with an Octane tab on Camera and
      Camera Edit LOPs for Thin Lens, Universal, Realistic Lens, Panoramic,
      Baking, and OSL camera parameters, Post Processing, and Imager/Denoiser
      controls.
    confidence: high
    verified: 2026-11-04
    sources:
