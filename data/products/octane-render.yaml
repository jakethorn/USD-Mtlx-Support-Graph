name: OctaneRender
vendor: OTOY
categories: [renderer]
industries: [film-tv, vfx, animation, product-design]
license: commercial
website: https://home.otoy.com/render/octane-render/
tier: 2
summary: >
  Unbiased spectrally correct GPU path tracer on CUDA and Metal with a Hydra
  render delegate for Houdini Solaris and NVIDIA Omniverse, standalone USD scene
  import, and native MaterialX 1.39.4 and OpenPBR Surface support since 2026.1.

releases:
  - version: "2026.6"
    date: 2026-10-14
    notes: >
      Added Standalone USD import for DistantLight, DomeLight_1, textured
      RectLights, and Blackbody light emission parity; fixed OpenPBR
      displacement map import from MaterialX and USD files, UDIM tile extraction
      in MaterialX Image nodes, and unsupported MaterialX node handling on USD
      import. Houdini/Solaris 2026.6.0.0 added support for MaterialX nodes
      implemented as Octane node graphs (such as mtlx separate nodes) and live
      IPR updates for octane:* camera and light attributes in Solaris.
    sources:
      - url: https://render.otoy.com/forum/viewtopic.php?t=85881
        title: "OctaneRender 2026.6 Release Notes"
        kind: release-notes
        accessed: 2026-11-04
      - url: https://render.otoy.com/forum/viewtopic.php?t=85883
        title: "OctaneRender 2026.6.0.0 for Houdini Production (including Solaris)"
        kind: release-notes
        accessed: 2026-11-04

  - version: "2026.5"
    date: 2026-09-13
    notes: >
      Added support for importing USD scenes with MaterialX image nodes using
      relative paths; fixed saving and loading USD materials in ORBX when
      originating from referenced .mtlx files, fixed USD import errors for
      unconnected MaterialX displacement, and fixed USD PointInstancers with
      time-varying instance counts. Houdini 2026.5.0.0 unified the Hydra
      Solaris plugin into the main Houdini plugin build and fixed Solaris
      velocity motion blur.
    sources:
      - url: https://render.otoy.com/forum/viewtopic.php?t=85834
        title: "OctaneRender 2026.5 Release Notes"
        kind: release-notes
        accessed: 2026-11-04
      - url: https://render.otoy.com/forum/viewtopic.php?t=85846
        title: "OctaneRender 2026.5.0.0 for Houdini Production (Unified Solaris Plugin)"
        kind: release-notes
        accessed: 2026-11-04

  - version: "2026.4"
    date: 2026-06-30
    notes: >
      Fixed an issue where imported USD geometry was not connected to its
      material in Standalone. Houdini Solaris 2026.4.0.0 added Hydra HioImage
      texture loading (including floating-point EXR), linear and sRGB texture
      color spaces, Octane Material Builder support, COP op:/opdef: texture
      assets, and fixed the MaterialX multiply node.
    sources:
      - url: https://render.otoy.com/forum/viewtopic.php?t=85726
        title: "OctaneRender 2026.4 Release Notes"
        kind: release-notes
        accessed: 2026-11-04
      - url: https://render.otoy.com/forum/viewtopic.php?t=85770
        title: "OctaneRender for HoudiniSolaris 2026.4.0.0 Release Notes"
        kind: release-notes
        accessed: 2026-11-04

  - version: "2026.3"
    date: 2026-04-22
    notes: >
      Added MaterialX import support for displacement shader subgraphs, float
      and color primvar import on USD curves, and point instance overrides in
      USD import preferences; updated the MaterialX importer to import
      UsdPreviewSurface as Standard Surface to align with the USD importer; and
      fixed motion blur on USD curves and PointInstancer/points loading from USD
      archives.
    sources:
      - url: https://render.otoy.com/forum/viewtopic.php?t=85624
        title: "OctaneRender 2026.3 Release Notes"
        kind: release-notes
        accessed: 2026-11-04

  - version: "2026.2"
    date: 2026-02-08
    notes: >
      Aligned OpenPBR Coat Darkening, view-dependent Coat absorption, and
      Specular/Coat Anisotropy (0–1 range) with the OpenPBR Surface
      specification, and added MaterialX node descriptions to the Lua API
      browser.
    sources:
      - url: https://render.otoy.com/forum/viewtopic.php?t=85487
        title: "OctaneRender 2026.2 Release Notes"
        kind: release-notes
        accessed: 2026-11-04

  - version: "2026.1"
    date: 2025-11-27
    materialx: "1.39.4"
    notes: >
      Introduced native MaterialX 1.39.4 support (over 130 native pattern nodes
      and import from .mtlx and USD files), native OpenPBR Surface material
      node, GPU path-traced Gaussian splats, meshlets, virtual streaming
      textures, Neural Radiance Cache (NRC), trace sets, and 10 float / 10
      color vertex attributes. Houdini Solaris 2026.1.0.1 added MaterialX node
      support in Solaris.
    sources:
      - url: https://render.otoy.com/forum/viewtopic.php?t=85315
        title: "OctaneRender 2026.1 Release Notes"
        kind: release-notes
        accessed: 2026-11-04
      - url: https://render.otoy.com/forum/viewtopic.php?t=85454
        title: "OctaneRender for HoudiniSolaris 2026.1.0.1 Release Notes"
        kind: release-notes
        accessed: 2026-11-04

  - version: "2025.1"
    date: 2025-03-30
    notes: >
      Added rest attribute support for animated meshes and geometry archives,
      Vectron and Volume SDF texture displacement, Spectral LensFX realistic
      lens camera, native surface decals, and Apple M3/M4 Metal-RT hardware
      acceleration improvements.
    sources:
      - url: https://render.otoy.com/forum/viewtopic.php?t=84667
        title: "OctaneRender 2025.1 Release Notes"
        kind: release-notes
        accessed: 2026-11-04

  - version: "2024.1"
    date: 2024-09-09
    notes: >
      Introduced a redesigned geometry pipeline with reduced VRAM usage, ORBX
      referencing, Open Image Denoise AOV filter graphs, texture and OSL nodes
      in the AOV compositor, and the Octane Hydra delegate for NVIDIA Omniverse
      and usdview (2024.1 - R2).
    sources:
      - url: https://render.otoy.com/forum/viewtopic.php?t=83998
        title: "OctaneRender 2024.1 Release Notes"
        kind: release-notes
        accessed: 2026-11-04
      - url: https://render.otoy.com/forum/viewtopic.php?t=84414
        title: "Octane Hydra | Omniverse 2024.1 - R2 Release Notes"
        kind: release-notes
        accessed: 2026-11-04

support:
  - capability: usd.hydra.delegate
    level: native
    hosts: [houdini, omniverse]
    notes: >
      OTOY provides the OctaneRender Hydra render delegate ($OCTVERSION/dso/usd_plugins)
      for Houdini Solaris (Houdini 20.5, 21.0, and 22.0 on Windows, Linux, and
      macOS; unified with the main Octane for Houdini plugin starting in
      2026.5.0.0) as well as a preview Octane Hydra delegate for NVIDIA
      Omniverse Composer and usdview.
    gaps:
      - "In Houdini Solaris, modifying material networks or node connections in IPR requires manually resetting the render to see updates (reported in 2026.6.0.0)."
      - "Houdini 22 Solaris builds cannot render Gaussian Splat point files yet (documented in 2026.4.0.0 release notes)."
      - "The Octane Hydra delegate for Omniverse has not been updated past the 2024.1 - R2 preview build."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://render.otoy.com/forum/viewtopic.php?t=85846
        title: "OctaneRender 2026.5.0.0 for Houdini Production (Unified Solaris & Houdini Plugin)"
        kind: release-notes
        accessed: 2026-11-04
      - url: https://render.otoy.com/forum/viewtopic.php?t=85883
        title: "OctaneRender 2026.6.0.0 for Houdini Production"
        kind: release-notes
        accessed: 2026-11-04
