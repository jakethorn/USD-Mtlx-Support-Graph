        kind: release-notes
        accessed: 2026-11-04
      - url: https://docs.otoy.com/SolarisH/Solaris/Rendering.htm
        title: "OctaneRender for SideFX Solaris Manual — Rendering"
        kind: docs
        accessed: 2026-11-04

  - capability: usd.render_settings
    level: native
    hosts: [houdini]
    notes: >
      In Houdini Solaris, Octane provides dedicated Octane tabs on the Render
      Settings LOP (selecting Direct Lighting, Path Tracing, PMC, or Info
      Channel kernels, max samples, and environment mode), Render Geometry
      Settings LOP (object layer parameters), and Octane AOVs LOP wired into
      Ordered Products for viewport viewing and USD Render ROP output.
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://docs.otoy.com/SolarisH/Solaris/RenderSettingsNode.htm
        title: "OctaneRender for SideFX Solaris Manual — Render Settings Node"
        kind: docs
        accessed: 2026-11-04
