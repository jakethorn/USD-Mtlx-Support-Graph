name: Katana
vendor: Foundry
categories: [lookdev]
industries: [film-tv, vfx, animation]
license: commercial
website: https://www.foundry.com/products/katana
tier: 1
summary: >-
  Foundry's look-development and lighting tool. USD arrives either through the UsdIn plug-ins (converted to Katana's
  Geolib data) or through native USD nodes that edit a live stage, with a Hydra-based Viewer that can host third-party
  render delegates.

