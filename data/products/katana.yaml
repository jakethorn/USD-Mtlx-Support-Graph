  - title: UsdIn always sets point-instancer arbitrary attributes to primitive scope, which Arnold cannot expand
    url: https://github.com/TheFoundryVisionmongers/KatanaUsdPlugins/issues/33
    capability: usd.instancing
    status: open
    verified: 2026-11-04

  - title: Pattern-Based Collections with membershipExpression do not update correctly (ID 579376, USD issue)
    url: https://katanasigned.s3.amazonaws.com/products/katana/releases/9.0v4/Katana_9.0v4_ReleaseNotes/index.html
