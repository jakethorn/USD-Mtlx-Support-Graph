        title: "maya-usd #3580: Maya USD Reference Animation 25 FPS time mismatch"
        kind: issue
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.skel
    level: native
    via: maya-usd
    notes: >-
      Export writes joints as UsdSkel skeletons, skinClusters as skinning and blend shapes as USD blendShapes. Import
      rebuilds joint hierarchies, bind poses and skinClusters, and blend shapes come in as Maya blend shapes (faster
      from maya-usd 0.35).
    gaps:
