        kind: repo
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/releases/tag/v0.35.0
        title: maya-usd v0.35.0 release
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.animation
    level: native
    via: maya-usd
    notes: >-
      Export writes time samples with frame step, multi-sample and Euler filter options, and import can read
      animated transforms, visibility, cameras and blend shapes. USD animation curves (splines) arrived in maya-usd
      0.32 for camera attributes (Maya 2026.1+). Light properties followed with USD 24.11+ and transforms with USD
      25.05+ in 0.33.
    gaps:
      - Transform animation curves need the optional USD 25.05 build on Maya 2026.2 and later, since 24.11 is the default there.
      - Open bug #3580 reports frame-rate mismatches when 25 fps animation is referenced into a stage without timeCodesPerSecond.
    sources:
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-3A763D43-E626-4832-9824-57AAA9BC0A00.html
