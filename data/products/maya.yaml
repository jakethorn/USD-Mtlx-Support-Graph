support:
  # ── Interchange ───────────────────────────────────────────────────────────
  - capability: usd.import
    level: native
    via: maya-usd
    notes: >-
      The USD extension ships in the Maya installer and is loaded as mayaUsdPlugin. File > Import offers a USD
      Hierarchy View to scope the import and pick variants. Materials can be left as-is or converted to Standard
      Surface, Lambert, USD Preview Surface, Blinn or Phong. Instanced prims become Maya instances, and the
      mayaUSDImport command exposes the same options.
    gaps:
      - Only one variant per variant set can be chosen for an import.
      - The point-based animation cache option only works for Mesh prims.
      - Some animation types, such as time-varying curve points, are not imported.
    sources:
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-65E19505-E27D-4477-BD7D-7C0F2BC0D328.html
        title: USD for Maya, USD Import options
        kind: docs
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/blob/dev/lib/mayaUsd/commands/Readme.md
        title: maya-usd command documentation (mayaUSDImport / mayaUSDExport)
        kind: repo
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/GUID-8FB49D7F-8651-47CE-80FC-5C940E568C97.html
        title: Install USD for Maya
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.export
    level: native
    via: maya-usd
    notes: >-
      Exports .usd, .usda or .usdc with options for meshes and subdivision schemes, component tags as GeomSubsets,
      colour and UV sets as primvars, NURBS curves, skeletons, blend shapes, materials, time-sampled animation,
      cameras, lights and visibility. Maya instances become instanceable references, and USD stages in the scene can
      be written as references to their layers. Axis and unit conversion arrived in maya-usd 0.31.
    gaps:
      - Export writes one Maya scene to one USD file.
    sources:
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-3A763D43-E626-4832-9824-57AAA9BC0A00.html
        title: USD for Maya, USD Export options
        kind: docs
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/blob/dev/lib/mayaUsd/commands/Readme.md
        title: maya-usd command documentation (mayaUSDImport / mayaUSDExport)
        kind: repo
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/releases
        title: maya-usd releases (v0.31.0 axis and units)
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.usdz
    level: native
    via: maya-usd
    notes: >-
      mayaUSDExport writes .usdz packages that bundle textures and layers, with an appleArKit compatibility profile
      that flattens to a single layer. On import, textures inside a USDZ archive are written out to the workspace's
      sourceimages folder or a chosen directory.
    gaps:
      - The Export dialog docs say a typed .usdz extension is not supported, so USDZ output is documented for the command.
      - Open bug #4273 reports wrong texture colour spaces when importing USDZ files.
    sources:
      - url: https://github.com/Autodesk/maya-usd/blob/dev/lib/mayaUsd/commands/Readme.md
        title: maya-usd command documentation (mayaUSDImport / mayaUSDExport)
        kind: repo
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-3A763D43-E626-4832-9824-57AAA9BC0A00.html
        title: USD for Maya, USD Export options
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-65E19505-E27D-4477-BD7D-7C0F2BC0D328.html
        title: USD for Maya, USD Import options
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Workflow ──────────────────────────────────────────────────────────────
  - capability: usd.stage
    level: native
    via: maya-usd
    notes: >-
      USD stages load into the viewport through a proxy shape and are edited in place from the Outliner, which can
      add prims, activate, hide, set the default prim and mark prims instanceable. Edit as Maya Data pulls a prim
      into Maya and caches the changes back to USD. Maya 2027 adds a Component Creator that builds a structured USD
      asset from selected objects, optionally from a template.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-USD/files/USD-for-Maya/USD-in-the-Maya-Interface/USD-data-in-the-Outliner/GUID-9FD37B6B-7559-4F9D-B393-3AAD9AB4F24B.html
        title: USD for Maya, USD contextual menu in the Outliner
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2027/ENU/Maya-WhatsNew/files/GUID-93ED1C8E-AF46-4F5A-BC07-8B66C7C3D32E.htm
        title: Maya 2027, New USD asset build workflows
        kind: release-notes
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd
        title: Autodesk/maya-usd README
        kind: repo
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.layer_editing
    level: native
    via: maya-usd
    notes: >-
      The USD Layer Editor sets the target layer for edits and can add anonymous sublayers, load file sublayers,
      mute, lock and bulk-save layers, and pin a stage. A Layer Data View shows a layer's contents (0.34). maya-usd
      0.37 adds sublayer merging and Edit Forwarding, a rules-based system that routes edits to the right layer, so
      far only lightly exposed in the Layer Editor.
    gaps:
      - Edits to weaker layers in the stack are blocked.
      - Locked layers cannot be targeted, and read-only layers get a limited set of options.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-USD/files/USD-for-Maya/GUID-4FAD73CA-E775-4009-9DCB-3BC6792C465E.html
        title: USD for Maya, USD Layer Editor
        kind: docs
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/releases/tag/v0.37.0
        title: maya-usd v0.37.0 release
        kind: release-notes
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/releases
        title: maya-usd releases (v0.34.0 Layer Data View)
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.plugins
    level: native
    via: maya-usd
    notes: >-
      The USD importer and exporter list registered plug-in configurations (for example Arnold's export context).
      maya-usd 0.34 added the Autodesk Asset Resolver, which handles tokens and environment variables in paths and can
      be extended with custom URI resolvers, on Linux and Windows at first, with Mac support added in 0.34.5.
    gaps:
      - Open bug #4537 reports that studio asset resolvers stop working with maya-usd 0.34 and later.
    sources:
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-3A763D43-E626-4832-9824-57AAA9BC0A00.html
        title: USD for Maya, USD Export options
        kind: docs
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/releases
        title: maya-usd releases (v0.34.0 Asset Resolver)
        kind: release-notes
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/issues/4537
        title: "maya-usd #4537: AdskAssetResolver disables our resolver"
        kind: issue
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Composition ───────────────────────────────────────────────────────────
  - capability: usd.composition.sublayers
    level: native
    via: maya-usd
    notes: The Layer Editor creates anonymous sublayers and loads existing layer files as sublayers of a chosen layer.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-USD/files/USD-for-Maya/GUID-4FAD73CA-E775-4009-9DCB-3BC6792C465E.html
        title: USD for Maya, USD Layer Editor
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.composition.references
    level: native
    via: maya-usd
    notes: >-
      Add USD Reference/Payload in the Outliner authors a reference to a file's default prim or a chosen prim path,
      prepended or appended. References can be reloaded (0.30) and cleared per edit target.
    gaps:
      - Referenced content shows in the viewport but not in the Outliner hierarchy.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-USD/files/USD-for-Maya/USD-in-the-Maya-Interface/USD-data-in-the-Outliner/GUID-EDC40BE3-2112-46D5-9E31-B620C08C8DDE.html
        title: USD for Maya, Add a reference in the Outliner
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-USD/files/USD-for-Maya/USD-in-the-Maya-Interface/USD-data-in-the-Outliner/GUID-9FD37B6B-7559-4F9D-B393-3AAD9AB4F24B.html
        title: USD for Maya, USD contextual menu in the Outliner
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.composition.payloads
    level: native
    via: maya-usd
    notes: >-
      Payload arcs can be authored from the Outliner with an option to load them immediately. Prims with payloads can
      be loaded or unloaded from the context menu, and maya-usd 0.27 (Maya 2025) added bulk load and unload.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-USD/files/USD-for-Maya/USD-in-the-Maya-Interface/USD-data-in-the-Outliner/GUID-EDC40BE3-2112-46D5-9E31-B620C08C8DDE.html
