        title: maya-usd v0.35.0 release
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.cameras
    level: native
    via: maya-usd
    notes: >-
      Cameras export and import, including camera attribute animation curves from Maya 2026.1. Standard viewport
      controls work when looking through a USD camera (Maya 2025.3+), and the Render Sequencer accepts USD cameras
      (Maya 2026+).
    sources:
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-3A763D43-E626-4832-9824-57AAA9BC0A00.html
        title: USD for Maya, USD Export options
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-WhatsNew/files/GUID-7EC10AEA-7EEF-4CE2-8A3C-FDA50AA3D4F0.htm
        title: What's New in USD for Maya (Maya 2026.1)
        kind: release-notes
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/releases
        title: maya-usd releases (v0.30.0, v0.31.0)
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.lights
    level: native
    via: maya-usd
    notes: >-
      Scene lights export, and standard USD lights get viewport shapes (Maya 2025.3+). Light linking and collections
      are edited in the Attribute Editor (0.31), and RectLight lighting and shadows draw in Maya 2026.3+ (0.34).
    gaps:
      - maya-usd 0.32 dropped USD light shading in Viewport 2.0 for Maya 2026, and 0.33 restored it for Maya 2026.2 and later.
      - Light linking with expression-based collections does not work with MtoA 5.4.x or older.
    sources:
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-3A763D43-E626-4832-9824-57AAA9BC0A00.html
        title: USD for Maya, USD Export options
        kind: docs
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/releases
        title: maya-usd releases (v0.30.0 to v0.34.0)
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Shading ───────────────────────────────────────────────────────────────
  - capability: usd.shade.preview_surface
    level: native
    via: maya-usd
    notes: >-
      USD Preview Surface is an export target and an import conversion option. It was the default export target
      until maya-usd 0.34 made MaterialX the default for new installs.
    gaps:
      - Open bug #4273 reports USD Preview Surface textures from USDZ files imported with the wrong colour spaces.
    sources:
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-3A763D43-E626-4832-9824-57AAA9BC0A00.html
        title: USD for Maya, USD Export options
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-65E19505-E27D-4477-BD7D-7C0F2BC0D328.html
        title: USD for Maya, USD Import options
        kind: docs
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/releases
        title: maya-usd releases (v0.34.0)
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.shade.materialx
    level: native
    via: maya-usd
    notes: >-
      The MaterialX shading export target writes bound shaders as a MaterialX UsdShade network, and it is the default
      target from maya-usd 0.34. From 0.32, LookdevX MaterialX stacks bound to geometry export straight into the USD
      shade graph, not as separate .mtlx files. Live stages can get MaterialX materials such as OpenPBR from Assign
      New Material.
    gaps:
      - Per a maintainer on #4209, USD's MaterialX loader ignores node definitions embedded in a document.
    sources:
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-3A763D43-E626-4832-9824-57AAA9BC0A00.html
        title: USD for Maya, USD Export options
        kind: docs
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/releases
        title: maya-usd releases (v0.30.0, v0.32.0, v0.34.0)
        kind: release-notes
        accessed: 2026-11-04
      - url: https://forum.aousd.org/t/usd-for-maya-and-max-updates/2500
        title: AOUSD forum, "USD for Maya and Max Updates" (Autodesk staff, June 2025)
        kind: forum
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/issues/4209
        title: "maya-usd #4209: MaterialX mix_surfaceshader and nodedefs support"
        kind: issue
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.shade.native
    level: native
    via: maya-usd
    notes: >-
      Besides UsdPreviewSurface and MaterialX, the exporter can write RenderMan for Maya shading networks. When MtoA
      is loaded, an Arnold plug-in configuration adds Arnold data to the export so it renders standalone with kick.
    gaps:
      - Importing such a file back into Maya does not restore all the Arnold data.
    sources:
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-3A763D43-E626-4832-9824-57AAA9BC0A00.html
        title: USD for Maya, USD Export options
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/ENU/AR-Maya/files/am-Arnold_for_Maya_User_Guide/shapes/arnold_for_maya_shapes_am_USD_html.html
        title: Arnold for Maya user guide, USD
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Rendering ─────────────────────────────────────────────────────────────
  - capability: usd.hydra.host
    level: experimental
    via: maya-hydra
    notes: >-
      Hydra for Maya (mayaHydra.mll) replaces the main viewport with a Hydra viewer using Storm or third-party render
      delegates such as Arnold's. It is enabled from the Plug-in Manager, and its renderer shows as "(Technology
      Preview) Hydra GL".
    sources:
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/GUID-8FB49D7F-8651-47CE-80FC-5C940E568C97.html
        title: Install USD for Maya
        kind: docs
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-hydra
        title: Autodesk/maya-hydra README
        kind: repo
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── MaterialX ─────────────────────────────────────────────────────────────
  - capability: mtlx.authoring
    level: native
    notes: >-
      LookdevX, Autodesk's look-development plugin, builds MaterialX graphs inside MaterialX Stacks
      that can be assigned to native Maya geometry. LookdevX 2.0 ships with Maya 2027.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/LookdevX/files/LookdevX_for_Maya/Getting_Started_with_LookdevX/GUID-C5538D9F-612D-4735-BAA9-96C0104CCB22.html
        title: LookdevX for Maya, Overview of the MaterialX data model
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2027/ENU/Maya-WhatsNew/files/GUID-D24D261B-4A78-47C2-918B-6EA461ADB002.htm
        title: What's New in Maya 2027
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: mtlx.import
    level: native
    since: "2026.2"
    notes: >-
      LookdevX 1.9 (Maya 2026.2) loads MaterialX documents into a MaterialX Stack. They stay linked to the file on
      disk, so edits can be saved back, discarded or saved as a copy.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-WhatsNew/files/GUID-26EA5B09-DA2E-4B71-9EA5-0391E4E5B8E8.htm
        title: What's New in LookdevX for Maya (Maya 2026.2)
        kind: release-notes
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/LookdevX/files/LookdevX_for_Maya/Getting_Started_with_LookdevX/GUID-C5538D9F-612D-4735-BAA9-96C0104CCB22.html
        title: LookdevX for Maya, Overview of the MaterialX data model
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: mtlx.export
    level: native
    notes: >-
      MaterialX Stacks and Documents export to .mtlx from the Outliner, with texture paths optionally relative to the
      .mtlx file. Maya 2027 (LookdevX 2.0) adds relative paths to the scene or workspace, and Archive Scene now
      bundles MaterialX files and their textures.
    gaps:
      - Archived scenes with absolute MaterialX paths may need manual repathing.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/LookdevX/files/LookdevX_for_Maya/Getting_Started_with_LookdevX/GUID-C5538D9F-612D-4735-BAA9-96C0104CCB22.html
        title: LookdevX for Maya, Overview of the MaterialX data model
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2027/ENU/Maya-WhatsNew/files/GUID-6DA3C115-C004-48DB-9D84-90D19E42E358.htm
        title: What's New in LookdevX for Maya (Maya 2027)
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: mtlx.render
    level: native
    notes: >-
      MaterialX stacks assigned to Maya geometry render in Viewport 2.0 (OpenGL/Core Profile) and in Arnold (MtoA
      5.4+), and LookdevX 1.9 added live node-preview swatches for MaterialX nodes.
    gaps:
      - LookdevX docs state that MaterialX does not support DirectX 11 in Viewport 2.0.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-WhatsNew/files/GUID-26EA5B09-DA2E-4B71-9EA5-0391E4E5B8E8.htm
        title: What's New in LookdevX for Maya (Maya 2026.2)
        kind: release-notes
        accessed: 2026-11-04
      - url: https://www.cgchannel.com/2024/03/autodesk-releases-maya-2025-and-maya-creative-2025
        title: CG Channel, "Autodesk releases Maya 2025 and Maya Creative 2025"
        kind: news
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/LookdevX/files/LookdevX_for_Maya/Getting_Started_with_LookdevX/GUID-C5538D9F-612D-4735-BAA9-96C0104CCB22.html
        title: LookdevX for Maya, Overview of the MaterialX data model
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: mtlx.color_management
    level: native
    since: "2026.2"
    notes: >-
      Maya's default OCIO config includes MaterialX colour spaces from 2026.2. LookdevX 1.10 (Maya 2026.3) shows
      document, node-graph and node colour spaces, defaults new documents to ACEScg or the colour-management
      preference, and writes a Raw colour space as "none".
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-WhatsNew/files/GUID-26EA5B09-DA2E-4B71-9EA5-0391E4E5B8E8.htm
        title: What's New in LookdevX for Maya (Maya 2026.2)
        kind: release-notes
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-WhatsNew/files/GUID-559E830D-519F-4570-9D79-1A2A99001654.htm
        title: What's New in LookdevX for Maya (Maya 2026.3)
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: mtlx.custom_nodes
    level: partial
    via: maya-usd
    notes: >-
      Custom MaterialX node definitions in standalone .mtlx files are discovered through MATERIALX_SEARCH_PATH and
      PXR_MTLX_STDLIB_SEARCH_PATHS.
    gaps:
      - Node definitions embedded inside a MaterialX document are not resolved by USD's MaterialX loader in Maya (#4209).
    sources:
      - url: https://github.com/Autodesk/maya-usd/issues/4209
        title: "maya-usd #4209: MaterialX mix_surfaceshader and nodedefs support"
        kind: issue
        accessed: 2026-11-04
    confidence: medium
    verified: 2026-11-04

  - capability: mtlx.openpbr
    level: native
    since: "2025.3"
    notes: >-
      OpenPBR Surface was added in Maya 2025.3 and became the default surface shader in Maya 2026, so every new scene
      gets an openPBRSurface node. It previews in Hypershade with the hardware or Arnold renderer. On live USD stages,
      Assign New Material offers an OpenPBR MaterialX shader (maya-usd 0.30, Maya 2025.3+).
    gaps:
      - Layer weights or colours above 1 break energy conservation.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-WhatsNew/files/GUID-2B248BA3-CC49-4695-BE16-251D5725BEE1.htm
        title: Maya 2026, Default surface shader OpenPBR
        kind: release-notes
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/ENU/MayaCRE-LightingShading/files/GUID-E36FC183-D437-491B-8C48-5CBD4B3974FE.htm
        title: OpenPBR Surface (Maya help)
        kind: docs
        accessed: 2026-11-04
      - url: https://www.cgchannel.com/2025/03/autodesk-releases-maya-2026-and-maya-creative-2026/
        title: CG Channel, "Autodesk releases Maya 2026 and Maya Creative 2026"
        kind: news
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/releases
        title: maya-usd releases (v0.30.0)
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: mtlx.standard_surface
    level: native
    notes: >-
      Maya has a native Standard Surface shader, and the USD importer can convert materials to it. A maya-usd
      maintainer points users to LookdevX's MaterialX Standard Surface alongside OpenPBR.
    sources:
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-65E19505-E27D-4477-BD7D-7C0F2BC0D328.html
        title: USD for Maya, USD Import options
        kind: docs
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/issues/4273
        title: "maya-usd #4273: Maya USDZ Import Incorrectly Displays USD Preview Surface Material"
        kind: issue
        accessed: 2026-11-04
    confidence: medium
    verified: 2026-11-04

  - capability: mtlx.preview_surface
    level: native
    notes: >-
      LookdevX's MaterialX BXDF library lists USD Preview Surface among its ready-made material definitions, alongside Standard Surface.
    gaps:
      - The page is a node-library description; it does not document rendering behaviour or limits of the node in Maya.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/LookdevX/files/LookdevX_for_Maya/LookdevX_LookdevX_for_Maya_LookdevX_Node_Libraries_html.html
        title: "LookdevX Node Libraries"
        kind: docs
        accessed: 2026-11-09
    confidence: high
    verified: 2026-11-09
    review: "Based on a node-library listing only; it is not stated whether this is the MaterialX UsdPreviewSurface nodedef or LookdevX's USD-native shader, and the page was read in the Chinese-locale copy of the help site."

