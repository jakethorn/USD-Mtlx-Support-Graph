        kind: issue
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Scene description ─────────────────────────────────────────────────────
  - capability: usd.geom.meshes
    level: native
    via: maya-usd
    notes: >-
      Mesh export picks a subdivision scheme (Catmull-Clark by default, Bilinear, Loop or none) and writes component
      tags as GeomSubsets and colour and UV sets as primvars. maya-usd 0.34 added import of left-handed meshes.
    sources:
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-3A763D43-E626-4832-9824-57AAA9BC0A00.html
        title: USD for Maya, USD Export options
        kind: docs
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/maya-usd/releases
        title: maya-usd releases (v0.34.0)
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.geom.curves
    level: native
    via: maya-usd
    notes: NURBS curves export as NurbsCurves or BasisCurves. maya-usd 0.35 fixed time-sample issues in curve export.
    gaps:
      - Time-varying curve points are not supported as imported animation.
    sources:
      - url: https://help.autodesk.com/cloudhelp/ENU/Maya-USD/files/USD-for-Maya/USD-import-export/GUID-3A763D43-E626-4832-9824-57AAA9BC0A00.html
