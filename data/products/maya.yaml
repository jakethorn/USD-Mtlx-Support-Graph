        title: USD for Maya, USD Import options
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.instancing
    level: native
    via: maya-usd
    notes: >-
      Instanceable prims import as Maya instances, and Maya instances export as instanceable references by default.
      The Outliner can mark or unmark prims as instanceable on a live stage.
    gaps:
      - Point instancers cannot be imported as Maya instancers (open request #3391).
    sources:
