      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-USD/files/USD-for-Maya/USD-in-the-Maya-Interface/USD-data-in-the-Outliner/GUID-9FD37B6B-7559-4F9D-B393-3AAD9AB4F24B.html
