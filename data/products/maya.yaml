        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-WhatsNew/files/GUID-7EC10AEA-7EEF-4CE2-8A3C-FDA50AA3D4F0.htm
        title: What's New in USD for Maya (Maya 2026.1)
        kind: release-notes
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-WhatsNew/files/GUID-5157FE90-8B78-4590-AF33-600E1E810AE6.htm
