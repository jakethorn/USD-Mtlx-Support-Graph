name: Maya
vendor: Autodesk
categories: [dcc]
industries: [film-tv, vfx, animation, games]
license: commercial
website: https://www.autodesk.com/products/maya/overview
tier: 1
summary: >-
  Autodesk's animation and VFX DCC. USD comes through the open-source maya-usd plugin bundled in the installer, which
  edits live stages. MaterialX authoring uses LookdevX, and OpenPBR is the default shader from Maya
  2026.

