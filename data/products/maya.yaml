        kind: news
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.composition.variants
    level: native
    via: maya-usd
    notes: >-
      The Outliner's Variant Sets submenu switches variants on a stage. Maya 2027 (maya-usd 0.35) adds a Variant
      Manager to add, remove and edit variant sets in one place, and the Component Creator can build assets as
      variants. maya-usd 0.37 lets the Variant Manager set prim purpose.
    gaps:
      - The importer brings in only one selected variant per variant set.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/Maya-USD/files/USD-for-Maya/USD-in-the-Maya-Interface/USD-data-in-the-Outliner/GUID-9FD37B6B-7559-4F9D-B393-3AAD9AB4F24B.html
