      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/GUID-4A9C51B2-69C1-4D9C-8DFA-47193905DC14.html
        title: USD for 3ds Max, Reference a USD Stage
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.lights
    level: native
    via: 3dsmax-usd
    notes: >-
      Photometric lights and the Sun Positioner export. 0.10 added light linking through the Collection widget and a
      light gizmo for 3ds Max 2025 and later.
    gaps:
      - Ambient and diffuse multipliers have limited export support.
      - USD light-linking expressions do not work in ActiveShade or Arnold legacy mode.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-DC04C60D-07CD-4844-AB96-4FDE25CCAD8C.html
        title: USD for 3ds Max, Export USD data
