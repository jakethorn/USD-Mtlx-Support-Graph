name: 3ds Max
vendor: Autodesk
categories: [dcc]
industries: [aec, games, film-tv, product-design]
license: commercial
website: https://www.autodesk.com/products/3ds-max/overview
tier: 1
summary: >-
  Autodesk's 3D modelling, animation and rendering DCC. USD comes through the open-source USD for 3ds Max component,
  bundled in the installer since 3ds Max 2026, which imports, exports and references live USD stages. OpenPBR is the
  default material from 3ds Max 2026.

releases:
  - version: "2027"
    usd: "25.11"
    materialx: "1.39.4"
    notes: >-
      Includes USD for 3ds Max 0.14.0, which focuses on stability, and Arnold for 3ds Max (MAXtoA) 5.9.0. Uses
      OpenColorIO 2.5.1.
    sources:
      - url: https://github.com/Autodesk/3dsmax-usd/blob/dev/doc/build.md
        title: 3dsmax-usd build documentation (per-version dependency table)
        kind: repo
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2027/ENU/3DSMax-What-s-New/files/GUID-7CC2F041-F797-4DB9-B2F9-326AAB994F37.htm
        title: What's New in 3ds Max 2027
        kind: release-notes
        accessed: 2026-11-04

  - version: "2026"
    date: 2025-03
    usd: "24.11"
    materialx: "1.38.10"
    notes: >-
      The first release with USD for 3ds Max (0.10) bundled in the installer. 0.10 added the USD Layer Editor and
      light linking. OpenPBR became the default material, and MAXtoA 5.8.0 shipped with Arnold 7.4.0.0.
    sources:
      - url: https://github.com/Autodesk/3dsmax-usd/blob/dev/doc/build.md
        title: 3dsmax-usd build documentation (per-version dependency table)
        kind: repo
        accessed: 2026-11-04
