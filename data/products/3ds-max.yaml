support:
  # ── Interchange ───────────────────────────────────────────────────────────
  - capability: usd.import
    level: native
    since: "2026"
    via: 3dsmax-usd
    notes: >-
      File > Import reads USD, with a filterable prim hierarchy to choose what to bring in, a frame range, material
      import and registered import plug-ins (chasers). Before 3ds Max 2026 the USD component was a separate install.
    gaps:
      - Vertex animation and material animation are not imported.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-0524FF19-5C9C-4066-A016-0F71C4482E2B.html
        title: USD for 3ds Max, Import USD data
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max-Release-Notes/GUID-61580AC0-7302-4B4B-9059-BADE926FA18B.html
        title: USD for 3ds Max 0.10 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.export
    level: native
    since: "2026"
    via: 3dsmax-usd
    notes: >-
      Exports binary or ASCII USD with options for mesh format, normals as primvars, vertex channels, shapes,
      materials, skin, morph targets, animation, cameras (including V-Ray and Arnold cameras), photometric lights and
      up axis. USD stage objects in the scene are written as references to their root layer.
    gaps:
      - Modifiers that change mesh topology prevent USD from resolving the modifier stack.
      - Exported stage references ignore any stage mask applied in 3ds Max.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-DC04C60D-07CD-4844-AB96-4FDE25CCAD8C.html
        title: USD for 3ds Max, Export USD data
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max-Release-Notes/GUID-61580AC0-7302-4B4B-9059-BADE926FA18B.html
        title: USD for 3ds Max 0.10 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.usdz
    level: native
    via: 3dsmax-usd
    notes: The exporter offers a USDZ Package format alongside binary and ASCII USD.
    gaps:
      - USDZ exports cannot carry MaterialX data.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-DC04C60D-07CD-4844-AB96-4FDE25CCAD8C.html
        title: USD for 3ds Max, Export USD data
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-CC8C2874-1F7C-45A3-B21A-6F8FE85516D5.html
        title: MaterialX and USD for 3ds Max
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Workflow ──────────────────────────────────────────────────────────────
  - capability: usd.stage
    level: native
    via: 3dsmax-usd
    notes: >-
      A USD stage node references a USD file without converting it. Prims can be transformed in sub-object mode,
      driven by 3ds Max controllers and viewed through USD cameras. Later releases added Promote to 3ds Max Object
      (0.11), Duplicate to USD (0.12), and prim rename, delete and reparent plus anonymous root layers (0.13).
    gaps:
      - The stage display requires OpenGL 4.5, and unsupported graphics cards can crash 3ds Max.
      - Autodesk staff said in January 2026 that material binding inside loaded stages is still planned.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/GUID-4A9C51B2-69C1-4D9C-8DFA-47193905DC14.html
        title: USD for 3ds Max, Reference a USD Stage
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max-Release-Notes/GUID-76AC25BC-C95A-4E04-8220-DB43509D2A68.html
        title: USD for 3ds Max 0.13 Release Notes
        kind: release-notes
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/3dsmax-usd/releases
        title: 3dsmax-usd releases
        kind: release-notes
        accessed: 2026-11-04
      - url: https://forum.aousd.org/t/usd-for-maya-and-3ds-max-updates/2646
        title: AOUSD forum, "USD for Maya and 3ds Max updates" (Autodesk staff replies, January 2026)
        kind: forum
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.layer_editing
    level: native
    since: "2026"
    via: 3dsmax-usd
    notes: >-
      USD for 3ds Max 0.10 added a USD Layer Editor that sets the edit target and can add or load sublayers, mute,
      lock and save layers. Edits can be saved to disk or into the .max file. 0.16.2 added layer merging.
    gaps:
      - Edits to weaker layers are blocked.
      - Read-only USD files are system-locked and cannot be unlocked by standard users.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/GUID-5820CFDE-36A2-4C4E-8E57-632881BBD9B2.html
        title: USD for 3ds Max, USD Layer Editor
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max-Release-Notes/GUID-61580AC0-7302-4B4B-9059-BADE926FA18B.html
        title: USD for 3ds Max 0.10 Release Notes
        kind: release-notes
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/3dsmax-usd/releases
        title: 3dsmax-usd releases (v0.16.2)
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

