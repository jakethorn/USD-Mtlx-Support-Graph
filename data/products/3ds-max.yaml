  - capability: usd.composition.variants
    level: partial
    via: 3dsmax-usd
    notes: >-
      The exporter can write Material Switcher inputs as material variant sets (3ds Max 2024 and later), or export only
      the active material.
    gaps:
      - Switching variant sets on a loaded USD stage is not documented; Autodesk staff said in January 2026 that variant set workflows were being worked on.
      - Complex inputs such as multi-materials cannot be exported as variant sets.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-DC04C60D-07CD-4844-AB96-4FDE25CCAD8C.html
        title: USD for 3ds Max, Export USD data
