        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-CC8C2874-1F7C-45A3-B21A-6F8FE85516D5.html
        title: MaterialX and USD for 3ds Max
        kind: docs
        accessed: 2026-11-04
      - url: https://forum.aousd.org/t/usd-for-maya-and-3ds-max-updates/2646
