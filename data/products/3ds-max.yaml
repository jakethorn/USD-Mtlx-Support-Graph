  # ── Scene description ─────────────────────────────────────────────────────
  - capability: usd.geom.meshes
    level: native
    via: 3dsmax-usd
    notes: >-
      Mesh export can keep the existing format or convert to polygons or triangles, and can write normals as primvars
      (the recommended option) along with vertex channels.
    gaps:
      - Open bug #40 reports normals authored as float3[] instead of normal3f[].
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-DC04C60D-07CD-4844-AB96-4FDE25CCAD8C.html
        title: USD for 3ds Max, Export USD data
        kind: docs
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/3dsmax-usd/issues/40
        title: "3dsmax-usd #40: primvars:normals authored as float3[] instead of normal3f[]"
        kind: issue
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.geom.curves
    level: native
    via: 3dsmax-usd
    notes: >-
      Shapes export as basic curve data, as BasisCurves when they don't render in the viewport, and spline animation
      exports. Since 0.10, USD BasisCurves display in the viewport.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-DC04C60D-07CD-4844-AB96-4FDE25CCAD8C.html
