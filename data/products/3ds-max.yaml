        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max-Release-Notes/GUID-61580AC0-7302-4B4B-9059-BADE926FA18B.html
        title: USD for 3ds Max 0.10 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.animation
    level: native
    via: 3dsmax-usd
    notes: >-
      Export writes time samples, animation curves or both for transforms, cameras and lights, plus vertex and spline
      animation. Import brings in transform, light and camera animation and blend shapes. Camera curves need USD 24.11+
      (0.13), and general animation-curve export arrived in 0.14 with USD 25.11+.
    gaps:
      - Vertex animation and material animation are not imported.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-DC04C60D-07CD-4844-AB96-4FDE25CCAD8C.html
        title: USD for 3ds Max, Export USD data
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-0524FF19-5C9C-4066-A016-0F71C4482E2B.html
        title: USD for 3ds Max, Import USD data
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max-Release-Notes/GUID-76AC25BC-C95A-4E04-8220-DB43509D2A68.html
