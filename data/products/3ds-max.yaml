    verified: 2026-11-04

  - capability: usd.cameras
    level: native
    via: 3dsmax-usd
    notes: >-
      Physical, free and target cameras export, as do two V-Ray and four Arnold camera types. USD cameras on a stage
      can be used in the viewport.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-DC04C60D-07CD-4844-AB96-4FDE25CCAD8C.html
        title: USD for 3ds Max, Export USD data
        kind: docs
