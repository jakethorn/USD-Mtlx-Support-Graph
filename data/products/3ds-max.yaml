        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max-Release-Notes/GUID-61580AC0-7302-4B4B-9059-BADE926FA18B.html
        title: USD for 3ds Max 0.10 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Shading ───────────────────────────────────────────────────────────────
  - capability: usd.shade.preview_surface
    level: native
    via: 3dsmax-usd
    notes: >-
      On export, USD Preview Surface and Physical Material convert to UsdPreviewSurface, including UDIMs through OSL
      bitmap maps. Unrecognised materials fall back to a name and diffuse colour. Import brings in shading data and
      builds UDIMs for USD Preview Surface materials. 0.14 added import of materials not bound to geometry.
    gaps:
      - Open bug #32 reports OpenPBR-to-UsdPreviewSurface conversion keeping only base colour and metallic, and OSL bitmaps tagged with the wrong colour space.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-DC04C60D-07CD-4844-AB96-4FDE25CCAD8C.html
        title: USD for 3ds Max, Export USD data
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-0524FF19-5C9C-4066-A016-0F71C4482E2B.html
        title: USD for 3ds Max, Import USD data
        kind: docs
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/3dsmax-usd/issues/32
        title: "3dsmax-usd #32: USD referenced as stage has wrong material"
        kind: issue
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.shade.materialx
    level: native
    via: 3dsmax-usd
    notes: >-
      With the MaterialX export option, prims assigned a MaterialX Material reference the MaterialX files. Since 0.13
      the importer also loads MaterialX materials referenced from USD files.
    gaps:
      - Exporting a MaterialX Material can lose parameters.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-CC8C2874-1F7C-45A3-B21A-6F8FE85516D5.html
        title: MaterialX and USD for 3ds Max
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max-Release-Notes/GUID-76AC25BC-C95A-4E04-8220-DB43509D2A68.html
        title: USD for 3ds Max 0.13 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── MaterialX ─────────────────────────────────────────────────────────────
  - capability: mtlx.import
    level: native
    via: 3dsmax-usd
    notes: >-
      The MaterialX Material, which ships with the USD component, loads a .mtlx file and lets you pick one of its
      materials. The MtlxIOUtil utility also imports .mtlx files. Under the hood the material becomes a Physical
      Material driven by an OSL texture network, and Explode Permanently turns it into editable OSL nodes.
    gaps:
      - Materials are converted to Physical Material and OSL nodes, not kept as native MaterialX graphs.
