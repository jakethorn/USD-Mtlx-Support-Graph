        kind: release-notes
        accessed: 2026-11-04
      - url: https://github.com/Autodesk/3dsmax-usd/releases
        title: 3dsmax-usd releases (v0.14.0)
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.skel
    level: native
    via: 3dsmax-usd
    notes: >-
      With Skin enabled, skinned meshes export as UsdSkel instead of vertex caches, and morph targets export as blend
      shapes. 0.13 added joint naming, bone collection and bone-mesh exclusion options. USD Skel animations import as
      skinned meshes.
    gaps:
      - Import skips skinned baked data where only the skeleton is animated.
      - The export page contradicts itself on progressive morphers, saying they are unsupported in one place and exported as in-between blend shapes in another.
      - Open bugs report invalid joint indices with hidden bones (#39) and missing skeletons when bones lack a common parent (#41).
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-DC04C60D-07CD-4844-AB96-4FDE25CCAD8C.html
        title: USD for 3ds Max, Export USD data
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-0524FF19-5C9C-4066-A016-0F71C4482E2B.html
        title: USD for 3ds Max, Import USD data
        kind: docs
        accessed: 2026-11-04
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max-Release-Notes/GUID-76AC25BC-C95A-4E04-8220-DB43509D2A68.html
        title: USD for 3ds Max 0.13 Release Notes
        kind: release-notes
        accessed: 2026-11-04
