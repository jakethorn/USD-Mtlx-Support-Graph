    confidence: high
    verified: 2026-11-04

  - capability: usd.composition.references
    level: native
    via: 3dsmax-usd
    notes: On export, USD stage objects in the scene are written as references to their root layer.
    gaps:
      - Exported references do not reflect a stage mask applied in 3ds Max.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/Import-and-export-USD-data-in-Max/GUID-DC04C60D-07CD-4844-AB96-4FDE25CCAD8C.html
        title: USD for 3ds Max, Export USD data
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.composition.payloads
    level: partial
    via: 3dsmax-usd
    notes: A stage node has a stage-wide Load Payloads toggle, and all payloads load by default.
    gaps:
      - Per-prim payload load and unload is not yet supported; Autodesk staff said in January 2026 that payload loading workflows were still planned.
    sources:
      - url: https://help.autodesk.com/cloudhelp/2026/ENU/3dsMax-USD/files/USD-for-3ds-Max/GUID-4A9C51B2-69C1-4D9C-8DFA-47193905DC14.html
