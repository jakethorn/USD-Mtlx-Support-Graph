        title: "OpenMoonRay/hdMoonray — lib/hydramoonray/BasisCurves.cc"
        kind: repo
        accessed: 2026-11-04
      - url: https://github.com/OpenMoonRay/moonshine_usd/blob/main/lib/geometry/usd/Curves.cc
        title: "OpenMoonRay/moonshine_usd — lib/geometry/usd/Curves.cc"
        kind: repo
        accessed: 2026-11-04

  - capability: usd.geom.points
    level: native
    notes: >
      hdMoonray (RdlPointGeometry) and UsdGeometry render UsdGeomPoints with
      per-point widths (converted to radius_list) or pscale, normals, UVs,
      surface derivatives (dPds, dPdt), velocity/acceleration motion blur, and
      arbitrary primvars.
    confidence: high
    verified: 2026-11-04
    sources:
