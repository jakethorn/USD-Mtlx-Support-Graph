  - capability: usd.volumes
    level: native
    notes: >
      hdMoonray translates Hydra volume Rprims and openvdbAsset Bprims into
      MoonRay VdbGeometry objects, binds density and velocity grids from the
      OpenVDB file path, and attaches MoonRay volume shaders (BaseVolume,
      CutoutVolume, VdbVolume).
    gaps:
      - "All fields on a volume prim in hdMoonray must reference the same .vdb file path."
      - "Volume.cc only binds density and velocity grid names directly on VdbGeometry."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://github.com/OpenMoonRay/hdMoonray/blob/main/lib/hydramoonray/Volume.cc
        title: "OpenMoonRay/hdMoonray — lib/hydramoonray/Volume.cc"
        kind: repo
        accessed: 2026-11-04
      - url: https://github.com/OpenMoonRay/hdMoonray/blob/main/lib/hydramoonray/Material.cc
        title: "OpenMoonRay/hdMoonray — lib/hydramoonray/Material.cc"
        kind: repo
        accessed: 2026-11-04

  - capability: usd.instancing
    level: native
    notes: >
      hdMoonray supports both USD native scenegraph instancing and
      UsdGeomPointInstancer, including nested multi-level instancing, inactiveIds
      masking, and per-instance primvars. In standalone RDL2 scenes,
      UsdInstanceGeometry instances geometry onto a USD PointInstancer prim and
      UsdGeometry traverses USD instance proxies.
    gaps:
      - "MoonRay does not support different light links per instance in the same instancer (the first instance's light linking is applied to all instances)."
      - "Hydra does not support light linking to prims inside an instance prototype graph."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://docs.openmoonray.org/user-reference/tools/hydra/hdmoonray-features/
        title: "OpenMoonRay Documentation — Supported Features in hdMoonray"
        kind: docs
