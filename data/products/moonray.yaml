  - capability: usd.shade.preview_surface
    level: native
    notes: >
      MoonRay provides native RDL2 implementations of UsdPreviewSurface,
      UsdUVTexture, UsdPrimvarReader (float, float2, float3, float4, int,
      normal, point, vector), and UsdTransform2d, and hdMoonray uses
      UsdPreviewSurface bound to displayColor and displayOpacity as the fallback
      material for geometry without an assigned material.
    confidence: high
    verified: 2026-11-04
    sources:
