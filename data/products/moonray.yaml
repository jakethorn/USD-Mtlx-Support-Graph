        title: "OpenMoonRay/moonshine_usd — dso/geometry/Usd/UsdGeometry.cc"
        kind: repo
        accessed: 2026-11-04

  - capability: usd.geom.meshes
    level: native
    notes: >
      Both hdMoonray (RdlMeshGeometry) and the UsdGeometry procedural support
      polygon meshes, Catmull-Clark and Bilinear subdivision schemes,
      GeomSubsets (mapped to MoonRay face parts for per-subset material and
      light assignment), normals, UVs (st/uv), and arbitrary primvars mapped to
      MoonRay UserData.
    gaps:
      - "Loop subdivision is not supported and falls back to Catmull-Clark."
      - "Subdivision holeIndices and the smooth triangleSubdivisionRule are ignored."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://docs.openmoonray.org/user-reference/tools/hydra/hdmoonray-features/
        title: "OpenMoonRay Documentation — Supported Features in hdMoonray"
        kind: docs
        accessed: 2026-11-04
      - url: https://github.com/OpenMoonRay/hdMoonray/blob/main/lib/hydramoonray/Mesh.cc
        title: "OpenMoonRay/hdMoonray — lib/hydramoonray/Mesh.cc"
        kind: repo
        accessed: 2026-11-04
      - url: https://github.com/OpenMoonRay/moonshine_usd/blob/main/lib/geometry/usd/Mesh.cc
        title: "OpenMoonRay/moonshine_usd — lib/geometry/usd/Mesh.cc"
        kind: repo
        accessed: 2026-11-04

  - capability: usd.geom.curves
    level: native
    notes: >
      hdMoonray (RdlCurveGeometry) and UsdGeometry support UsdGeomBasisCurves
      with linear, bspline, and bezier curve types, widths (converted to radius),
      normals (fixed in 2.40.0.1), UVs, and arbitrary primvars.
    gaps:
      - "Catmull-Rom basis, curve indices, and periodic or pinned curve wrap modes are not supported in hdMoonray (UsdGeometry detects pinned curves via repeated endpoint vertices for width interpolation)."
      - "GeomSubsets cannot be applied to curves."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://docs.openmoonray.org/user-reference/tools/hydra/hdmoonray-features/
        title: "OpenMoonRay Documentation — Supported Features in hdMoonray"
        kind: docs
        accessed: 2026-11-04
