  - capability: usd.lights
    level: native
    notes: >
      hdMoonray supports UsdLux CylinderLight, DiskLight, DistantLight,
      DomeLight, RectLight, SphereLight, GeometryLight (via
      MoonrayMeshLightAdapter), PortalLight (added in 1.7.0.0), and LightFilters
      (via MoonrayLightFilterAdapter), along with UsdLux light, shadow, and
      light-filter linking collections and moonray:<attr> attribute overrides.
      Lights with shaping:coneAngle < 90 are automatically converted to MoonRay
      SpotLights.
    gaps:
      - "ShapingAPI cone angle conversion only matches accurately on DiskLight (and approximates area on RectLight)."
      - "Per-instance light linking is not supported."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://docs.openmoonray.org/user-reference/tools/hydra/hdmoonray-features/
        title: "OpenMoonRay Documentation — Supported Features in hdMoonray"
        kind: docs
        accessed: 2026-11-04
