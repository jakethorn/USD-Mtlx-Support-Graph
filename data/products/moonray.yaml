support:
  - capability: usd.hydra.delegate
    level: native
    hosts: [houdini, maya]
    notes: >
      The hdMoonray render delegate plugin (hdMoonray.so) translates Hydra scene
      data into MoonRay RDL2 objects and runs in usdview, Houdini Solaris, Maya,
      and standalone CLI tools (hd_render, hd_usd2rdl). By default it launches
      out-of-process Arras local or distributed render sessions, with an
      in-process debug mode (hd_moonray_debug) available. Includes
      moonrayShaderDiscovery and moonrayShaderParser Sdr plugins plus Houdini
      Solaris HDAs and parameter interfaces via moonray_dcc_plugins.
    gaps:
      - "All textures in USD scenes must be tiled and mipmapped (.tx), or pre-converted with usd_mipmap_images."
      - "Hydra 2.0 client support for Houdini 21+ and Maya 2026 is still in an unmerged PR (OpenMoonRay/hdMoonray#14)."
      - "In-process debug mode can freeze the Houdini GUI due to TBB thread contention."
      - "Light Filters and RenderVars UI are listed as not yet available in the Houdini integration guide."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://docs.openmoonray.org/user-reference/tools/hydra/
        title: "OpenMoonRay Documentation — MoonRay Hydra Plugin (hdMoonray)"
        kind: docs
        accessed: 2026-11-04
      - url: https://docs.openmoonray.org/user-reference/tools/hydra/hdmoonray-setup/
        title: "OpenMoonRay Documentation — Setting up hdMoonray"
        kind: docs
        accessed: 2026-11-04
      - url: https://docs.openmoonray.org/user-reference/tools/hydra/hdmoonray-houdini/
        title: "OpenMoonRay Documentation — Running hdMoonray in Houdini"
        kind: docs
        accessed: 2026-11-04
      - url: https://docs.openmoonray.org/user-reference/tools/hydra/render-settings/
        title: "OpenMoonRay Documentation — Render Settings in hdMoonray"
        kind: docs
        accessed: 2026-11-04
      - url: https://github.com/OpenMoonRay/hdMoonray/pull/14
        title: "OpenMoonRay/hdMoonray PR #14 — Support Hydra 2.0 clients (Houdini 21, Maya 2026)"
        kind: issue
        accessed: 2026-11-04

  - capability: usd.render_settings
    level: native
    hosts: [houdini, maya]
    notes: >
      hdMoonray exposes render delegate settings (Arras host count, remote hosts,
      log level, max FPS, debug mode, RDL output file, double-sided, OptiX/OIDN
      denoising, execution mode) in usdview, Houdini Solaris, and Maya, and maps
      any USD render setting prefixed with moonray:sceneVariable: (or
      sceneVariable_ in Houdini) to MoonRay RDL2 SceneVariables. Cryptomatte AOV
      support in hdMoonray was added in 1.7.0.0.
    gaps:
      - "Houdini Solaris integration docs note that a dedicated RenderVars UI is not yet available."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://docs.openmoonray.org/user-reference/tools/hydra/render-settings/
        title: "OpenMoonRay Documentation — Render Settings in hdMoonray"
        kind: docs
        accessed: 2026-11-04
      - url: https://docs.openmoonray.org/user-reference/tools/hydra/hdmoonray-houdini/
        title: "OpenMoonRay Documentation — Running hdMoonray in Houdini"
        kind: docs
        accessed: 2026-11-04
