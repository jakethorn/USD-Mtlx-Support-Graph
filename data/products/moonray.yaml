        kind: repo
        accessed: 2026-11-04

  - capability: usd.shade.materialx
    level: experimental
    since: "2026.29.0"
    notes: >
      OpenMoonRay 2026.29.0 and 2026.29.1 introduced work-in-progress support for
      translating and rendering MaterialX map shader nodes in hdMoonray via the
      materialx_shaders repository (when compiled with
      -DBUILD_MATERIALX_SHADERS=ON).
    gaps:
      - "MaterialX BSDF, EDF, VDF, and SurfaceShader nodes (such as ND_standard_surface_surfaceshader) are not yet included in releases (#318)."
      - "Multiple-output MaterialX shaders are not yet supported by scene_rdl2 and hdMoonray (#319)."
    confidence: high
