        title: "OpenMoonRay/hdMoonray — lib/hydramoonray/RenderSettings.cc"
        kind: repo
        accessed: 2026-11-04
      - url: https://github.com/OpenMoonRay/openmoonray/releases/tag/openmoonray-1.7.0.0
        title: "OpenMoonRay Release 1.7.0.0 (Cryptomatte support in hdMoonRay)"
