        accessed: 2026-11-04

  - capability: usd.import
    level: native
    notes: >
      Supported through two native paths: (1) hd_render and hd_usd2rdl CLI tools
      in hdMoonray, which render a USD stage directly or translate it to MoonRay
      RDL2 (.rdla/.rdlb) via Hydra; and (2) UsdGeometry and UsdInstanceGeometry
      procedural geometry DSOs in moonshine_usd, which load USD stages and prim
      hierarchies directly inside RDL2 scenes with optional UsdUtilsStageCache
      sharing or stage population masking.
    gaps:
      - "All textures referenced by USD scenes must be tiled and mipmapped (the bundled usd_mipmap_images tool converts textures to mipmapped EXR/TX and updates USD asset paths)."
    confidence: high
    verified: 2026-11-04
    sources:
      - url: https://docs.openmoonray.org/user-reference/tools/hydra/commands/
        title: "OpenMoonRay Documentation — Command-line tools in hdMoonray (hd_render, hd_usd2rdl)"
