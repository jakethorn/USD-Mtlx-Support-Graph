        title: "OpenMoonRay/moonshine_usd — dso/geometry/Usd/UsdGeometry.cc"
        kind: repo
        accessed: 2026-11-04

  - capability: usd.skel
    level: native
    notes: >
      hdMoonray supports Hydra extComputation Sprims for usdSkelImaging skinning
      (tested in hats/geometry/geometry_skel.usd), and moonshine_usd directly
      evaluates UsdSkelRoot, UsdSkelCache, UsdSkelSkeletonQuery, and
      UsdSkelSkinningQuery to deform skinned meshes, curves, and points.
    confidence: high
    verified: 2026-11-04
    sources:
