  - capability: usd.shade.native
    level: native
    notes: >
      All MoonRay material, map, displacement, and volume shaders can be
      authored as UsdShade networks and are registered with USD's Sdr registry
      via the moonrayShaderDiscovery and moonrayShaderParser plugins using JSON
      shader definitions exported by rdl2_json_exporter.
    confidence: high
    verified: 2026-11-04
    sources:
