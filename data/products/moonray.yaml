        accessed: 2026-11-04

  - capability: usd.cameras
    level: native
    notes: >
      hdMoonray translates Hydra cameras into MoonRay PerspectiveCamera or
      OrthographicCamera with depth of field, near/far clipping planes, shutter
      intervals, and camera motion blur, and supports selecting specialty
      cameras (FisheyeCamera, SphericalCamera, BakeCamera) via moonray:class and
      moonray:<attr> prim attributes.
    confidence: high
    verified: 2026-11-04
    sources:
