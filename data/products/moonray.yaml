        title: "OpenMoonRay/hdMoonray — lib/hydramoonray/Instancer.cc"
        kind: repo
        accessed: 2026-11-04

  - capability: usd.animation
    level: native
    notes: >
      hdMoonray and UsdGeometry support time-sampled transformation and
      deformation motion blur across camera shutter intervals, as well as
      velocity, acceleration, and automatic motion blur modes on meshes, curves,
      points, and instancers.
    confidence: high
    verified: 2026-11-04
    sources:
