name: MoonRay
vendor: DreamWorks Animation
categories: [renderer]
industries: [film-tv, animation, vfx]
license: open-source
website: https://openmoonray.org/
repo: OpenMoonRay/openmoonray
tier: 2
summary: >
  DreamWorks Animation's open-source MCRT production renderer (OpenMoonRay) with
  an hdMoonray Hydra render delegate for usdview, Houdini Solaris, and Maya,
  native UsdGeometry/UsdInstanceGeometry procedurals, UsdPreviewSurface, and
  experimental MaterialX map shader support.

