        title: Unreal Engine 5.6 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.composition.variants
    level: experimental
    notes: >-
      Variant selections can be switched in the Stage Editor's Properties panel. Since 5.6 Interchange can
      also import variant-style LODs.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/usd-stage-editor-quick-start-in-unreal-engine
