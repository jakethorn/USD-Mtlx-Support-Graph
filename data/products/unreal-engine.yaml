        title: Unreal Engine 5.4 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.physics
    level: partial
    notes: >-
      Release notes cover collision schemas only: collisions were added to USD coverage in 5.4, and 5.6
      added physics collision schemas to Interchange. Chaos Cloth assets import through dedicated schemas in 5.8,
      where the notes also mention importing USD constraints.
    gaps:
      - Rigid body (UsdPhysicsRigidBodyAPI) import is not documented.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-8-release-notes
        title: Unreal Engine 5.8 Release Notes
        kind: release-notes
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-6-release-notes?application_version=5.6
        title: Unreal Engine 5.6 Release Notes
