        title: Universal Scene Description in Unreal Engine (5.8 docs)
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.volumes
    level: native
    notes: >-
      Volumes referencing OpenVDB files import as Sparse Volume Textures (Interchange since 5.6).
    gaps:
      - 5.4 release notes limit usdVol support to OpenVDB assets.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-6-release-notes?application_version=5.6
        title: Unreal Engine 5.6 Release Notes
        kind: release-notes
        accessed: 2026-11-04
