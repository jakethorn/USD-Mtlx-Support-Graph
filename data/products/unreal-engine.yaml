name: Unreal Engine
vendor: Epic Games
categories: [game-engine]
industries: [games, film-tv, automotive, aec, simulation]
license: source-available
website: https://www.unrealengine.com
tier: 1

# How levels are assigned here. Unreal has two USD paths, both shipped inside the engine:
#  - the USD Importer plugin (Engine/Plugins/Importers/USDImporter: USD Stage Editor, USD Stage Actor,
#    legacy stage importer and the USD exporter). It is bundled but must be enabled, and the 5.8 docs
#    label it Beta, so records that depend on it are `experimental`.
#  - USD through the Interchange framework (added in 5.5). The 5.8 release notes call it production
#    ready for asset import and experimental for level import, so asset-level records are `native`.
# Both are closed components of the engine, so no `via` is set.

releases:
  - version: "5.8"
    date: 2026-06-17
    notes: >-
      The release notes do not state the bundled OpenUSD or MaterialX version. USD import through
      Interchange is declared production ready for asset import (level import stays experimental), and
      an experimental USD Asset Pre-Generation framework is added.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-8-release-notes
        title: Unreal Engine 5.8 Release Notes
        kind: release-notes
        accessed: 2026-11-04
      - url: https://forums.unrealengine.com/t/unreal-engine-5-8-released/2729274
        title: Unreal Engine 5.8 Released (Epic forum announcement)
        kind: news
        accessed: 2026-11-04

  - version: "5.7"
    usd: "25.08"
    materialx: "1.39.3"
    notes: Release notes list "Upgraded OpenUSD version to v25.08" and "Upgraded MaterialX version to v1.39.3".
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-7-release-notes?application_version=5.7
        title: Unreal Engine 5.7 Release Notes
        kind: release-notes
        accessed: 2026-11-04

  - version: "5.6"
    usd: "25.02a"
    materialx: "1.38.10"
    notes: Release notes say OpenUSD was upgraded to v25.02a (a hotfix of 25.02) and MaterialX to 1.38.10.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-6-release-notes?application_version=5.6
        title: Unreal Engine 5.6 Release Notes
        kind: release-notes
        accessed: 2026-11-04

  - version: "5.5"
    usd: "24.05"
    notes: >-
      Release notes say OpenUSD was upgraded to v24.05. This release also added USD to the Interchange
      framework and moved USD SDK access into a new USDCore plugin. The MaterialX version is not stated.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-5-release-notes
        title: Unreal Engine 5.5 Release Notes
        kind: release-notes
        accessed: 2026-11-04

support:
  # ── Interchange ──────────────────────────────────────────────────────────
  - capability: usd.import
    level: native
    notes: >-
      Two bundled import paths: the USD Importer plugin (Import Into Level, Content Browser import, or
      Actions > Import in the USD Stage Editor) and USD through Interchange, added in 5.5. In 5.8 Epic calls
      Interchange USD production ready for asset import; schema handlers are reorderable and the USD
      translator can be extended in C++ for custom schemas.
    gaps:
      - Importing USD into a level through Interchange is still experimental in 5.8.
      - The USD Importer plugin must be enabled from the Plugins menu, and its docs label it Beta.
      - Lightmaps are not generated automatically, so a static lighting build of an imported stage can come out black.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-8-release-notes
        title: Unreal Engine 5.8 Release Notes — USD Import with Interchange
        kind: release-notes
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/universal-scene-description-in-unreal-engine
        title: Universal Scene Description in Unreal Engine (5.8 docs)
        kind: docs
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/API/PluginIndex/USDImporter
        title: USD Importer plugin index (5.8 docs)
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.export
    level: experimental
    notes: >-
      The USDExporter module of the bundled USD Importer plugin exports levels, level sequences and assets
      (static and skeletal meshes, animation sequences, geometry caches, baked materials) to USD, from the
      editor or via the LevelExporterUSDOptions Python API. Recorded as experimental because the plugin is
      labelled Beta.
    gaps:
      - Since 5.6 exported assets go into a flat Assets folder rather than mirroring the Content Browser hierarchy.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/python-api/class/LevelExporterUSDOptions
        title: unreal.LevelExporterUSDOptions (Python API, 5.8)
        kind: docs
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-6-release-notes?application_version=5.6
        title: Unreal Engine 5.6 Release Notes
        kind: release-notes
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-5-release-notes
        title: Unreal Engine 5.5 Release Notes
        kind: release-notes
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/API/PluginIndex/USDImporter
        title: USD Importer plugin index (5.8 docs)
        kind: docs
        accessed: 2026-11-04
      - url: https://forums.unrealengine.com/t/usd-exports-have-wrong-reference-paths/2649958
        title: USD exports have wrong reference paths (Epic staff replies)
        kind: forum
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.usdz
    level: native
    notes: >-
      .usdz files load alongside .usd, .usda and .usdc, and since 5.6 Interchange handles textures packed
      inside USDZ files.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/universal-scene-description-in-unreal-engine
        title: Universal Scene Description in Unreal Engine (5.8 docs)
        kind: docs
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-6-release-notes?application_version=5.6
        title: Unreal Engine 5.6 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Workflow ─────────────────────────────────────────────────────────────
  - capability: usd.stage
    level: experimental
    notes: >-
      The USD Stage Editor and USD Stage Actor open a USD file as a live stage in the level; edits made in
      the editor are written back to the USD file with File > Save, and stages can also be loaded at
      runtime with the Set Root Layer Blueprint node. Supports multi-user editing.
    gaps:
      - Each opened USD file needs its own USD Stage Actor.
      - Runtime loading needs FORCE_ANSI_ALLOCATOR=1 in the project's Target.cs.
      - Prim deletion can't be undone during a multi-user session, and all users must reach the files via the same path.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/universal-scene-description-in-unreal-engine
        title: Universal Scene Description in Unreal Engine (5.8 docs)
        kind: docs
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/usd-stage-editor-quick-start-in-unreal-engine
        title: USD Stage Editor Quick Start (5.8 docs)
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.layer_editing
    level: experimental
    notes: >-
      The Stage Editor has a Layers panel for adding new or existing layers, muting layers and choosing the
      edit target, and can export all layers, selected layers, a flattened stage or a flattened layer stack.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/python-api/class/UsdStageEditorLibrary
        title: unreal.UsdStageEditorLibrary (Python API)
        kind: docs
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/usd-stage-editor-quick-start-in-unreal-engine
        title: USD Stage Editor Quick Start (5.8 docs)
        kind: docs
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-5-release-notes
        title: Unreal Engine 5.5 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.plugins
    level: native
    notes: >-
      Loads USD plugins such as the Alembic file format and custom path resolvers. Since 5.8 the
      Interchange USD translator can also be extended in C++ to handle custom schemas.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/universal-scene-description-in-unreal-engine
        title: Universal Scene Description in Unreal Engine (5.8 docs)
        kind: docs
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-8-release-notes
        title: Unreal Engine 5.8 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

