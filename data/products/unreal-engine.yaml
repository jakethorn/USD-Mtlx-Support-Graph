        title: Importing USDs with referenced MTLX files does not work when using UDIMs (Epic staff replies)
        kind: forum
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.shade.native
    level: experimental
    notes: >-
      MDL surface materials authored with NVIDIA's MDL USD schema are supported. Since 5.6 the MDL schema
      translator is a separate plugin (USD Importer MDL integration) that depends on the Beta USD Importer.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/universal-scene-description-in-unreal-engine
        title: Universal Scene Description in Unreal Engine (5.8 docs)
        kind: docs
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-6-release-notes?application_version=5.6
