        title: Unreal Engine 5.4 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Shading ──────────────────────────────────────────────────────────────
  - capability: usd.shade.preview_surface
    level: native
    notes: >-
      UsdPreviewSurface and displayColor materials import via reference materials configured in the USD
      project settings; on export, Unreal materials are baked to USD, with the refraction channel added in 5.8.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/universal-scene-description-in-unreal-engine
        title: Universal Scene Description in Unreal Engine (5.8 docs)
        kind: docs
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-8-release-notes
        title: Unreal Engine 5.8 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.shade.materialx
    level: native
    notes: >-
      MaterialX surfaces embedded in a USD stage, or .mtlx files referenced from USD, import through
      Interchange; embedded MaterialX support was added in 5.6.
    gaps:
      - Per Epic staff, the legacy USD Stage importer handles only referenced .mtlx files, not MaterialX authored as UsdShade.
      - Transmission and subsurface scattering can't be evaluated together in the same shading path.
    sources:
      - url: https://dev.epicgames.com/documentation/unreal-engine/importing-materialx-files-in-unreal-engine?lang=en-US
        title: Importing MaterialX files in Unreal Engine (5.8 docs)
        kind: docs
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-6-release-notes?application_version=5.6
