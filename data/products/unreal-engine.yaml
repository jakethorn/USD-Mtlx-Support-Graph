        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.composition.payloads
    level: experimental
    notes: >-
      Payloads can be loaded and unloaded per prim from the Stage Editor, with Load All / Load None options
      and an initial load set that can also be set from Blueprints at runtime.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/universal-scene-description-in-unreal-engine
