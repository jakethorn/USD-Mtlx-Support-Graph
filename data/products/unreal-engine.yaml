        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.instancing
    level: native
    notes: >-
      The USD docs list hierarchical instanced static meshes among supported prim types, Interchange gained
      point-instance support in 5.7, and instanced prims reuse the same generated assets on import.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-7-release-notes?application_version=5.7
        title: Unreal Engine 5.7 Release Notes
        kind: release-notes
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/universal-scene-description-in-unreal-engine
        title: Universal Scene Description in Unreal Engine (5.8 docs)
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Scene description ────────────────────────────────────────────────────
  - capability: usd.geom.meshes
    level: native
    notes: >-
      Meshes import as static meshes. 5.7 added a custom SubdivisionAPI schema for a per-prim subdivision
      level and subdivision of static meshes and geometry caches on Interchange import; primitive shape
      schemas are also handled.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-7-release-notes?application_version=5.7
        title: Unreal Engine 5.7 Release Notes
        kind: release-notes
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-6-release-notes?application_version=5.6
        title: Unreal Engine 5.6 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.geom.curves
    level: native
    since: "5.7"
    notes: >-
      Interchange USD imports groom assets and groom caches from 5.7, and 5.8 adds support for all groom
      attributes.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-7-release-notes?application_version=5.7
        title: Unreal Engine 5.7 Release Notes
        kind: release-notes
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-8-release-notes
        title: Unreal Engine 5.8 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.animation
    level: native
    notes: >-
      Transform animation maps to Level Sequence transform tracks and other animated attributes to the
      stage's Time track; animated meshes can import as geometry caches (Interchange since 5.6). Sequencer
      key edits are written back to the stage.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/universal-scene-description-in-unreal-engine
        title: Universal Scene Description in Unreal Engine (5.8 docs)
        kind: docs
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-6-release-notes?application_version=5.6
        title: Unreal Engine 5.6 Release Notes
        kind: release-notes
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-7-release-notes?application_version=5.7
        title: Unreal Engine 5.7 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.skel
    level: native
    notes: >-
      Skeletal meshes, blend shapes and skeletal animation import from UsdSkel; Interchange produces
      AnimSequence assets, and 5.8 adds skeletal mesh collapsing.
    gaps:
      - Recent releases still fix edge cases, such as skeletons with several root bones or non-unique prim names (5.7).
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-6-release-notes?application_version=5.6
        title: Unreal Engine 5.6 Release Notes
        kind: release-notes
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-7-release-notes?application_version=5.7
        title: Unreal Engine 5.7 Release Notes
        kind: release-notes
        accessed: 2026-11-04
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-8-release-notes
        title: Unreal Engine 5.8 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.cameras
    level: experimental
    notes: >-
      UsdGeomCamera parameters convert to Unreal camera properties, with clip-plane support expanded in
      5.8. Cameras arrive as actors, so they come through the Beta stage workflow or Interchange level
      import, which is experimental.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-6-release-notes?application_version=5.6
        title: Unreal Engine 5.6 Release Notes
        kind: release-notes
