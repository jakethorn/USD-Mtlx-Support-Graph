      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-8-release-notes
        title: Unreal Engine 5.8 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.lights
    level: experimental
    notes: >-
      UsdLux lights import as Unreal light actors: dome lights as sky lights (Interchange, 5.7), DomeLight_1
      treated as DomeLight (5.8), point/spot radius and distant-light angle (5.8), and basic UsdLuxShadowAPI
      (5.5). Lights are actors, so they come through the Beta stage workflow or experimental Interchange level import.
    gaps:
      - Files authored before USD 21.05 need a Python script to rename light attributes.
    sources:
      - url: https://dev.epicgames.com/documentation/en-us/unreal-engine/unreal-engine-5-8-release-notes
        title: Unreal Engine 5.8 Release Notes
        kind: release-notes
        accessed: 2026-11-04
