        title: USD Importer plugin index (5.8 docs)
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── MaterialX ────────────────────────────────────────────────────────────
  - capability: mtlx.import
    level: native
    notes: >-
      .mtlx files import directly into the Content Browser through Interchange, configured under Project
      Settings > Interchange MaterialX. In Substrate projects they become native Substrate materials.
    gaps:
      - Displacement only shows on Nanite-enabled meshes, and Nanite doesn't support transparent materials.
      - Full OpenPBR expressiveness needs the Adaptive GBuffer, which adds storage and evaluation cost.
    sources:
      - url: https://dev.epicgames.com/documentation/unreal-engine/importing-materialx-files-in-unreal-engine?lang=en-US
        title: Importing MaterialX files in Unreal Engine (5.8 docs)
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: mtlx.standard_surface
    level: native
    notes: Standard Surface, including a transmission variant, is a supported surface model on MaterialX import.
    sources:
      - url: https://dev.epicgames.com/documentation/unreal-engine/importing-materialx-files-in-unreal-engine?lang=en-US
        title: Importing MaterialX files in Unreal Engine (5.8 docs)
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: mtlx.openpbr
    level: native
