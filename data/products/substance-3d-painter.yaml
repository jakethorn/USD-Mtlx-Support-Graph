name: Substance 3D Painter
vendor: Adobe
categories: [texturing]
industries: [games, film-tv, vfx, product-design]
license: commercial
website: https://www.adobe.com/products/substance3d/apps/painter.html
tier: 1
summary: >-
  Adobe's 3D texture-painting application. Projects can be created from USD files, with scope, variant, subdivision
  and frame options, and textures and materials export as USD or USDZ. OpenPBR 1.1 has been the default shader since
  12.1; no native MaterialX export is documented.

