name: ZBrush
vendor: Maxon
categories: [dcc]
industries: [film-tv, vfx, games, animation, product-design]
license: commercial
website: https://www.maxon.net/en/zbrush
tier: 2
summary: >-
  Digital sculpting and painting tool. Ships with the USD Format plugin (Zplugin > USD Format, added in 2021.6) for
  importing and exporting meshes—plus USDZ since 2025.0—rather than complete scenes.

