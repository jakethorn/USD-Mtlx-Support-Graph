support:
  # ── Interchange ──────────────────────────────────────────────────────────
  - capability: usd.import
    level: partial
    since: "2021.6"
    notes: >-
      The bundled USD Format plugin (Zplugin > USD Format > Load and ReLoad) opens a USD file tree and imports a
      selected Mesh prim or the immediate parent of a Mesh, with ReLoad reloading the last loaded selection from the
      same file.
    gaps:
      - Imports meshes only rather than whole scenes; items in the USD file tree that are not a Mesh or the immediate parent of a Mesh cannot be selected.
      - The macOS version requires macOS 10.12 or later.
    sources:
      - url: https://help.maxon.net/zbr/en-us/Content/html/user-guide/zbrush-other-programs/usd-format/usd-format.html
        title: USD format (ZBrush User Guide)
        kind: docs
        accessed: 2026-11-04
      - url: https://help.maxon.net/zbr/en-us/Content/html/reference-guide/release-notes/zbrush-2021-6/zbrush-2021-6.html
        title: ZBrush 2021.6 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.export
    level: partial
    since: "2021.6"
    notes: >-
      The bundled USD Format plugin (Zplugin > USD Format > Save and ReSave) exports the Selected SubTool, Visible
      SubTools or All SubTools of the active tool to a USD file, and ReSave overwrites the previously saved file.
    gaps:
      - Exports meshes only rather than whole scenes.
      - The documentation does not describe exporting materials, textures, lights or cameras through the USD Format plugin.
    sources:
      - url: https://help.maxon.net/zbr/en-us/Content/html/user-guide/zbrush-other-programs/usd-format/usd-format.html
        title: USD format (ZBrush User Guide)
        kind: docs
        accessed: 2026-11-04
      - url: https://help.maxon.net/zbr/en-us/Content/html/features/main-features/import-export/import-export.html
        title: Import & Export (ZBrush User Guide)
        kind: docs
        accessed: 2026-11-04
      - url: https://help.maxon.net/zbr/en-us/Content/html/reference-guide/release-notes/zbrush-2021-6/zbrush-2021-6.html
        title: ZBrush 2021.6 Release Notes
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.usdz
    level: partial
    since: "2025.0"
    notes: >-
      ZBrush 2025.0 added USDZ format support to the USD Format plugin.
    gaps:
      - Subject to the USD Format plugin's mesh-only scope rather than full scene interchange.
      - The 2025.0 What's New notes state "Support for USDZ format added to the USD plugin" without detailing separate Load vs Save options.
    sources:
      - url: https://help.maxon.net/zbr/en-us/Content/html/features/whats-new-in-zbrush/zbrush-whats-new.html
        title: "ZBrush: What's New Guide (2025.0)"
        kind: release-notes
        accessed: 2026-11-04
      - url: https://help.maxon.net/zbr/en-us/Content/html/user-guide/zbrush-other-programs/usd-format/usd-format.html
        title: USD format (ZBrush User Guide)
        kind: docs
        accessed: 2026-11-04
    confidence: medium
    verified: 2026-11-04
    review: "Unclear whether USDZ support in the desktop USD Format plugin is export-only (as reported by CG Channel and mirrored in ZBrush for iPad's export-only USDZ support) or includes Load; Maxon's What's New notes only state 'Support for USDZ format added to the USD plugin'."

  # ── Scene description ────────────────────────────────────────────────────
  - capability: usd.geom.meshes
    level: native
    since: "2021.6"
    notes: >-
      Imports Mesh prims (or the immediate parent of a Mesh) from a USD file tree and exports Selected, Visible or All
      SubTools as meshes to a USD file.
    gaps:
      - The USD Format documentation does not state whether subdivision levels, Crease levels, Polypaint vertex colours, PolyGroups or UV maps are preserved on import or export.
    sources:
      - url: https://help.maxon.net/zbr/en-us/Content/html/user-guide/zbrush-other-programs/usd-format/usd-format.html
        title: USD format (ZBrush User Guide)
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.cameras
    level: none
    notes: >-
      The USD Format plugin documentation states that the plugin only imports and exports meshes rather than whole
      scenes, and on import only allows selecting a Mesh or the immediate parent of a Mesh.
    sources:
      - url: https://help.maxon.net/zbr/en-us/Content/html/user-guide/zbrush-other-programs/usd-format/usd-format.html
        title: USD format (ZBrush User Guide)
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.lights
    level: none
    notes: >-
      The USD Format plugin documentation states that the plugin only imports and exports meshes rather than whole
      scenes, and on import only allows selecting a Mesh or the immediate parent of a Mesh.
    sources:
      - url: https://help.maxon.net/zbr/en-us/Content/html/user-guide/zbrush-other-programs/usd-format/usd-format.html
        title: USD format (ZBrush User Guide)
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04
