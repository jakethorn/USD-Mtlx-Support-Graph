    url: https://developer.apple.com/documentation/realitycomposerpro/reality-composer-pro-3-release-notes
    capability: usd.shade.materialx
    status: unknown
    affects: "Reality Composer Pro 3"
    severity: major
    verified: 2026-11-04
    review: Listed as a known issue for Reality Composer Pro 3; the 3.1 notes no longer list it but don't say it was fixed.
