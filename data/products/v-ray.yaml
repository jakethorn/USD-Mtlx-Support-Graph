support:
  # ── Rendering ─────────────────────────────────────────────────────────────
  - capability: usd.hydra.delegate
    level: native
    hosts: [houdini, katana, nuke]
    notes: >-
      The V-Ray Hydra delegate ships with V-Ray for Houdini, with no extra plugin needed. It renders in the Solaris
      viewport (IPR) and in batch through husk (HdVRayRendererPlugin). Solaris support was added in build 5.10.20,
      Linux and macOS delegates in 5.20.02, and Apple Silicon builds in 7.00.10. Initial Hydra 2 support came in
      7.20.10, and the 7.40.30 release notes add delegate support for usdview, usdrecord, and the latest Nuke and
      Katana versions.
    gaps:
      - V-Ray Fur, V-Ray Plane and V-Ray Enmesh are not supported in Solaris.
      - V-Ray supports only 32-bit precision for floating-point attributes.
      - Building scenes in /obj and bringing them in through the Scene Import LOP is only partially supported, and material assignments can fail.
    sources:
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/113279168/Solaris%20FAQ
        title: V-Ray for Houdini, Solaris FAQ
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/113279113/Solaris%20Features%20and%20Limitations
        title: V-Ray for Houdini, Solaris Features and Limitations
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/113282047/V-Ray%205
        title: V-Ray for Houdini release notes, V-Ray 5
        kind: release-notes
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/969048157/7.40.30
        title: V-Ray for Houdini release notes, 7.40.30
        kind: release-notes
        accessed: 2026-11-04
      - url: https://www.chaos.com/vray/houdini/features
        title: V-Ray for Houdini features
        kind: other
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.render_settings
    level: native
    hosts: [houdini]
    notes: >-
      V-Ray settings sit in a V-Ray tab on the Solaris Render Settings LOP, and final renders go through the USD
      Render ROP. AOVs are authored with RenderVar LOPs. Render settings primitive support is listed under USD in
      7.10.00, and 7.40.30 exposes the V-Ray render settings to usdview/Hydra.
    gaps:
      - By default none of the V-Ray parameters are written to USD unless they are explicitly set on the LOP.
    sources:
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/113279421/Solaris%20Render%20Settings
        title: V-Ray for Houdini, Solaris Render Settings
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/113279234/7.10.00
        title: V-Ray for Houdini release notes, 7.10.00
        kind: release-notes
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/969048157/7.40.30
        title: V-Ray for Houdini release notes, 7.40.30
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.render_settings
    level: native
    hosts: [maya]
    via: maya-usd
    notes: >-
      USD export from Maya can include V-Ray render settings and render elements. From 7.20.02, render settings,
      camera and render elements are exported in a standard USD layout.
    gaps:
      - SettingsDecal, SettingsHair, SettingsLightLinker, SettingsRTEngine and VRayStereoscopicSettings are not exported.
    sources:
      - url: https://documentation.chaos.com/space/VMAYA/111739268/USD%20Supported%20Features
        title: V-Ray for Maya, USD Supported Features
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VMAYA/356712449/7.20.02
        title: V-Ray for Maya release notes, 7.20.02
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.render_settings
    level: native
    hosts: [3ds-max]
    since: "7.3"
    notes: The 7.30.02 release notes add export of V-Ray render settings to USD.
    gaps:
      - The general 3ds Max USD help page still carries an older note listing render settings export as a temporary limitation.
    sources:
      - url: https://documentation.chaos.com/space/VMAX/707559558/7.30.02
        title: V-Ray for 3ds Max release notes, 7.30.02
        kind: release-notes
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VMAX/113586826/USD
        title: V-Ray for 3ds Max, USD
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Interchange ───────────────────────────────────────────────────────────
  - capability: usd.import
    level: native
    hosts: [maya]
    via: maya-usd
    notes: >-
      V-Ray renders USD stages loaded through MayaUSD proxy shapes, including meshes, particles, hair, VDB volumes,
      UsdSkel, V-Ray and USD lights, and V-Ray materials stored in USD. With mayaUSDImport and the V-Ray shading
      mode, V-Ray materials in USD come back as native V-Ray materials. From V-Ray 6 Update 2 the default USD
      translator is Hydra-compatible. Chaos says V-Ray USD support in Maya starts with 5.20.02. Each V-Ray build
      supports specific MayaUSD versions.
    gaps:
      - Unsaved USD edits may render wrongly with distributed rendering, Chaos Cloud or .vrscene export.
      - Assets linked inside USD files may fail to resolve with distributed rendering, Chaos Cloud or .vrscene export.
      - IPR support for USD edits is limited.
      - Instancing lights is not yet supported with the Hydra translator, and disabled lights are always rendered.
    sources:
      - url: https://documentation.chaos.com/space/VMAYA/111739268/USD%20Supported%20Features
        title: V-Ray for Maya, USD Supported Features
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VMAYA/111739288/USD%20Workflow
        title: V-Ray for Maya, USD Workflow
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VMAYA/111738904/USD%20Version%20Support
        title: V-Ray for Maya, USD Version Support
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.import
    level: native
    hosts: [3ds-max]
    notes: >-
      USD files are rendered through a USD Stage object (V-Ray 6 Update 1 and later) or a VRayScene object.
      Renders meshes, animation, particles, UsdPreviewSurface, V-Ray materials, textures and lights, and 3ds Max
      MaterialX materials. Material overrides on USD Stage objects work from V-Ray 6 Update 2. Relies on Autodesk's
      USD for 3ds Max plugin, and Chaos lists supported plugin versions per V-Ray build.
    gaps:
      - The 3ds Max USD Importer is not supported. V-Ray renders USD via the USD Stage or VRayScene objects instead.
      - Mismatched 3ds Max system units and USD meters-per-unit render V-Ray lights, displacement, bump and translucent materials incorrectly.
      - V-Ray Proxies inside USD can be previewed only in a USD Stage node, not in a VRayScene object.
    sources:
      - url: https://documentation.chaos.com/space/VMAX/113586826/USD
        title: V-Ray for 3ds Max, USD
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.export
    level: native
    hosts: [maya]
    via: maya-usd
    notes: >-
      Uses the MayaUSD exporter with the V-Ray plug-in configuration. Materials can be written as UsdPreviewSurface
      or as V-Ray materials, and vrayExportUsdMaterials exports materials without geometry. Also exports V-Ray
      lights, displacement and subdivision, Physical and Dome cameras, proxies, render elements, MaterialX
      materials, crease sets, XGen interactive grooms and Gaussian splats.
    gaps:
      - V-Ray Fur, volumes and scenes with hair cannot yet be exported to USD.
      - Light textures export only with the Export All option.
      - V-Ray Decal is not supported.
      - MayaUSD 0.29 is not supported by V-Ray for Maya because of a discrepancy when exporting V-Ray data.
    sources:
      - url: https://documentation.chaos.com/space/VMAYA/111739268/USD%20Supported%20Features
        title: V-Ray for Maya, USD Supported Features
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VMAYA/111739288/USD%20Workflow
        title: V-Ray for Maya, USD Workflow
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VMAYA/111738904/USD%20Version%20Support
        title: V-Ray for Maya, USD Version Support
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.export
    level: native
    hosts: [3ds-max]
    since: "6.1"
    notes: >-
      Uses the 3ds Max USD exporter with V-Ray selected as the plug-in configuration (6.1.1 and later). Exports V-Ray
      materials and textures, lights, displacement, VRayInstancer, VRayProxy, the Physical Camera, animated shader
      and light parameters, and 3ds Max MaterialX materials.
    gaps:
      - Object properties and V-Ray properties are not exported. Use VRayWrapperMtl for matte objects.
      - Light instancing through VRayInstancer is not exported.
      - VRayLightMtl direct illumination, Disc light maps and light or texture exclude lists are not exported.
      - Some textures, such as VRayDistanceTex and VRayDirt, are not exported.
    sources:
      - url: https://documentation.chaos.com/space/VMAX/113586826/USD
        title: V-Ray for 3ds Max, USD
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.usdz
    level: native
    hosts: [houdini]
    notes: >-
      The Solaris FAQ lists .usd, .usda and .usdz as supported formats. Release notes for 7.20.10 and 7.40.30 fix a
      crash with a specific USDZ file and missing USDZ textures in usdview.
    sources:
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/113279168/Solaris%20FAQ
        title: V-Ray for Houdini, Solaris FAQ
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/969048157/7.40.30
        title: V-Ray for Houdini release notes, 7.40.30
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Workflow ──────────────────────────────────────────────────────────────
  - capability: usd.plugins
    level: native
    hosts: [maya]
    notes: >-
      Renders USD content from dynamic USD plugins, for example Golaem for USD. V-Ray resolves assets with its own
      V-Ray USD asset resolver.
    gaps:
      - The Autodesk USD Asset Resolver added in MayaUSD 0.34 does not work with V-Ray 7 Update 2.
    sources:
      - url: https://documentation.chaos.com/space/VMAYA/111739268/USD%20Supported%20Features
        title: V-Ray for Maya, USD Supported Features
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VMAYA/111738904/USD%20Version%20Support
        title: V-Ray for Maya, USD Version Support
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Composition and scene description ─────────────────────────────────────
  - capability: usd.instancing
    level: native
    hosts: [houdini]
    notes: >-
      Instancing and variants are listed as supported in Solaris. 7.40.30 significantly reduces memory use for
      nested instancing.
    gaps:
      - Lights on an instancer's class prim also emit light unless you disable them, and Chaos says this will be fixed.
    sources:
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/113279113/Solaris%20Features%20and%20Limitations
        title: V-Ray for Houdini, Solaris Features and Limitations
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/113279168/Solaris%20FAQ
        title: V-Ray for Houdini, Solaris FAQ
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/969048157/7.40.30
        title: V-Ray for Houdini release notes, 7.40.30
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.animation
    level: native
    hosts: [maya, 3ds-max]
    notes: >-
      Rendering USD files supports animated transforming and deforming meshes and animated shader parameters in
      both hosts. Maya also supports motion blur for animated meshes and light parameter animation is listed for
      3ds Max.
    sources:
      - url: https://documentation.chaos.com/space/VMAYA/111739268/USD%20Supported%20Features
        title: V-Ray for Maya, USD Supported Features
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VMAX/113586826/USD
        title: V-Ray for 3ds Max, USD
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.skel
    level: native
    hosts: [maya]
    notes: >-
      USD Skel is listed among the features supported when rendering USD files. 7.20.02 fixed meshes with UsdSkel
      not rendering in V-Ray Standalone.
    sources:
      - url: https://documentation.chaos.com/space/VMAYA/111739268/USD%20Supported%20Features
        title: V-Ray for Maya, USD Supported Features
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VMAYA/356712449/7.20.02
        title: V-Ray for Maya release notes, 7.20.02
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.cameras
    level: native
    hosts: [houdini, maya]
    notes: >-
      In Solaris, the V-Ray Physical Camera settings are on the Camera LOP, and since 7.00.10 the USD camera
      shutter open and close drive motion blur. 7.40.30 adds stereoscopic cameras. In Maya, V-Ray Physical Cameras
      and their attributes round-trip through USD export and mayaUSDImport.
    sources:
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/113279421/Solaris%20Render%20Settings
        title: V-Ray for Houdini, Solaris Render Settings
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/113278998/V-Ray%207
        title: V-Ray for Houdini release notes, V-Ray 7 (build 7.00.10)
        kind: release-notes
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/969048157/7.40.30
        title: V-Ray for Houdini release notes, 7.40.30
        kind: release-notes
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VMAYA/111739288/USD%20Workflow
        title: V-Ray for Maya, USD Workflow
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.lights
    level: native
    hosts: [houdini]
    notes: >-
      Solaris Light, Distant Light and Dome Light LOPs carry the USD lighting schema parameters in their base tabs
      and V-Ray-specific settings in a V-Ray tab. Light filters, the Light Mixer and the Light Linker are supported.
      7.40.30 adds MeshLightAPI support and light linker support for USD 25.x.
    gaps:
      - Before 7.40.30, V-Ray parameters on basic USD lights did not update in IPR with USD 25 and later.
    sources:
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/113279856/Working%20with%20Solaris%20Lights
        title: V-Ray for Houdini, Working with Solaris Lights
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/969048157/7.40.30
        title: V-Ray for Houdini release notes, 7.40.30
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.lights
    level: native
    hosts: [maya]
    notes: >-
      Renders USD light types stored in USD files, including those from Maya spot, directional and point lights,
      and V-Ray lights. V-Ray lights can be exported. 7.40.02 adds support for the USD light normalize attribute.
    gaps:
      - Instancing lights is not yet supported with the Hydra translator.
      - Disabled lights are always rendered with the Hydra translator.
    sources:
      - url: https://documentation.chaos.com/space/VMAYA/111739268/USD%20Supported%20Features
        title: V-Ray for Maya, USD Supported Features
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VMAYA/950763526/7.40.02
        title: V-Ray for Maya release notes, 7.40.02
        kind: release-notes
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.volumes
    level: native
    hosts: [houdini, maya]
    notes: >-
      Solaris supports live volumes and native Houdini volumes. In Maya, VDB volumes referenced in USD files render.
    gaps:
      - Volumes cannot yet be exported to USD from Maya.
    sources:
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/113279113/Solaris%20Features%20and%20Limitations
        title: V-Ray for Houdini, Solaris Features and Limitations
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VMAYA/111739268/USD%20Supported%20Features
        title: V-Ray for Maya, USD Supported Features
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  # ── Shading ───────────────────────────────────────────────────────────────
  - capability: usd.shade.native
    level: native
    hosts: [houdini, maya, 3ds-max]
    notes: >-
      V-Ray material and texture networks are stored in UsdShade and rendered back. In Solaris they are built with
      a V-Ray Material Builder inside a Material Library LOP. Maya and 3ds Max export V-Ray shaders to USD and
      render V-Ray materials found in USD files.
    sources:
      - url: https://documentation.chaos.com/space/VRAYHOUDINI/113279860/Working%20with%20Solaris%20Materials
        title: V-Ray for Houdini, Working with Solaris Materials
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VMAYA/111739268/USD%20Supported%20Features
        title: V-Ray for Maya, USD Supported Features
        kind: docs
        accessed: 2026-11-04
      - url: https://documentation.chaos.com/space/VMAX/113586826/USD
        title: V-Ray for 3ds Max, USD
        kind: docs
        accessed: 2026-11-04
    confidence: high
    verified: 2026-11-04

  - capability: usd.shade.preview_surface
    level: native
    hosts: [maya, 3ds-max]
    notes: >-
      Both hosts list UsdPreviewSurface among supported materials when rendering USD files. Maya can also export
      materials as USD Preview Surface. V-Ray 7 for Maya added fallback color support in UsdUVTexture and V-Ray
      material overrides for usdPreviewSurface.
