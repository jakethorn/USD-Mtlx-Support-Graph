  - capability: usd.shade.materialx
    level: native
    hosts: [houdini]
    notes: >-
      The V-Ray Hydra delegate renders MaterialX shaders in Solaris. Chaos describes a shared translation layer, so
      V-Ray and V-Ray Hydra read the same set of MaterialX nodes. Release notes add MaterialX 1.39 support in
      7.20.10, plus 1.39 and later and primvar parameter overrides in 7.40.30.
    gaps:
      - MaterialX volumetric shading, layered BRDF shaders and MaterialX lights are not supported in Solaris.
      - Chaos's MaterialX blog says LaMa nodes are not supported. The post may predate later updates.
