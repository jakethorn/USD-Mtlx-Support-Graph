    level: native
    hosts: [houdini, maya]
    notes: >-
      Chaos says V-Ray in Solaris supports the MaterialX Standard Surface material. In Maya, Chaos documents a
      LookDevX workflow for Standard Surface on USD geometry. The Standard Surface Dispersion parameter was added in
      7.20.10 for Houdini and 7.20.02 for Maya.
