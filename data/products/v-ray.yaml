  - capability: usd.shade.materialx
    level: native
    hosts: [maya]
    notes: >-
      Renders USD files with MaterialX shaders and lets you change their assignments. With LookDevX, MaterialX
      shaders can be created and edited on a USD stage with interactive IPR updates. Chaos publishes a per-node
      support table with separate CPU and GPU columns.
    gaps:
      - Many MaterialX nodes are CPU-only in the support table, for example image, noise and most trigonometry nodes.
      - Some nodes are unsupported on both CPU and GPU, for example curveadjust, premult, bitangent, ambientocclusion, blackbody and the transform point, vector and normal nodes.
      - MaterialX light nodes are not supported.
    sources:
