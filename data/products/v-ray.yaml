  - capability: mtlx.openpbr
    level: native
    hosts: [maya, 3ds-max, houdini]
    notes: >-
      VRayMtl has an OpenPBR shading mode (Maya from 7.0, 3ds Max from 7.2). V-Ray 7 for Maya also added OpenPBR
      Surface in MaterialX and Maya's native OpenPBR Surface (Maya 2025.3). V-Ray 7 for 3ds Max supports the 3ds Max
      2025.3 OpenPBR material, and V-Ray for Houdini 7.40.30 adds OpenPBR support for USD.
    gaps:
      - OpenPBR is only partly supported on V-Ray GPU.
      - Some OpenPBR parameters have no V-Ray mapping, including transmission scatter and its anisotropy, subsurface scatter anisotropy and geometry tangents.
      - Anisotropy tangent mapping is not supported, and only tangent- and world-space normals are supported.
    sources:
