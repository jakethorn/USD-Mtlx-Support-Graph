  # ── MaterialX ─────────────────────────────────────────────────────────────
  - capability: mtlx.render
    level: native
    hosts: [houdini, maya]
    notes: >-
      V-Ray reads MaterialX graphs through a reusable translation layer shared by its integrations, and the Maya
      support table maps MaterialX nodes to V-Ray texture plugins (for example ND_mix to TexMix). Chaos says other
      V-Ray products can load .mtlx files read-only.
    gaps:
      - V-Ray GPU supports a smaller set of MaterialX nodes than V-Ray CPU.
    sources:
      - url: https://blog.chaos.com/materialx-and-v-ray-crafting-the-next-chapter-in-3d-creativity
