name: V-Ray
vendor: Chaos
categories: [renderer]
industries: [film-tv, vfx, aec, product-design, automotive]
license: commercial
website: https://www.chaos.com/vray
tier: 1
summary: >-
  Production renderer from Chaos with separate integrations per host. USD support differs by host, with a
  Hydra render delegate for Houdini Solaris, MayaUSD-based workflows in Maya, USD for 3ds Max workflows, and
  MaterialX and OpenPBR shading.

