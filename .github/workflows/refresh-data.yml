name: Refresh generated data

# Re-reads upstream OpenUSD / MaterialX releases, schema and node catalogues, and GitHub
# stats. If anything changed it commits data/generated/ to main and triggers a deploy.
on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write # commit refreshed data
  actions: write # trigger the deploy workflow

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Ingest upstream data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run ingest

      - name: Validate
        run: npm run validate

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet -- data/generated; then
            echo "No changes to generated data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated
          git commit -m "Refresh generated data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so start the deploy explicitly.
      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --ref main
